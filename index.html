<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOW BALI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:430px;min-height:100vh;margin:auto;padding-bottom:80px}header{height:65px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292e3a;position:sticky;top:0;background:#090b12;z-index:2}.logo{font-size:27px;font-weight:900}.logo span{color:#ff7438}.live{color:#55e39a;border:1px solid #28704e;border-radius:20px;padding:6px 9px;font-size:10px}.page{padding:15px}.muted{color:#8991a4;font-size:11px}.card{background:#12151e;border:1px solid #292e3a;border-radius:18px;margin:12px 0;overflow:hidden}.hero{height:190px;background:linear-gradient(#0000,#000d),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80") center/cover;position:relative}.hero div{position:absolute;bottom:14px;left:14px}.badge{background:linear-gradient(90deg,#ff3fa4,#ff7438);padding:6px 10px;border-radius:20px;font-size:10px;font-weight:bold}.row{padding:14px;border-bottom:1px solid #252936}.row:last-child{border:0}.score{color:#ff7438;font-size:21px;font-weight:bold;margin-right:12px}button{color:white}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#ff3fa4,#ff7438);font-weight:bold}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:72px;background:#0d1018;border-top:1px solid #292e3a;display:flex;justify-content:space-around;align-items:center;z-index:5}nav button{border:0;background:none;color:#778094;font-size:18px}nav small{display:block;font-size:9px;margin-top:3px}#plus{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff3fa4,#ff7438);font-size:26px}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;z-index:10}.hidden{display:none}.sheet{width:min(430px,100%);background:#12151e;border-radius:24px 24px 0 0;padding:20px}textarea{width:100%;height:110px;background:#080a10;color:#fff;border:1px solid #303644;border-radius:14px;padding:12px;margin:12px 0}.close{float:right;background:none;border:0;color:#aaa;font-size:25px}.back{background:none;border:0;padding:0;font-size:14px;color:#ff7846}
</style></head><body><div id="app"><header><div class="logo">NOW <span>BALI</span></div><div class="live">● LIVE</div></header><main id="main"></main>
<nav><button onclick="show('now')">🔥<small>NOW</small></button><button onclick="show('near')">📍<small>NEAR</small></button><button id="plus">+</button><button onclick="show('people')">👥<small>PEOPLE</small></button><button onclick="show('me')">◉<small>ME</small></button></nav>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="modal.classList.add('hidden')">×</button><h2>Post NOW</h2><div class="muted">📍 Canggu Beach</div><textarea id="txt" placeholder="Apa yang sedang terjadi sekarang?"></textarea><button class="btn" onclick="post()">POST NOW</button></div></div></div>
<script>
const main=document.getElementById('main'),modal=document.getElementById('modal');let posts=JSON.parse(localStorage.getItem('now_posts')||'[]');
function show(t){if(t==='now')main.innerHTML='<div class="page"><h2>🔥 HAPPENING NOW</h2><div class="card"><div class="hero"><div><span class="badge">NOW SCORE 94</span><h1>🔥 Canggu Beach</h1><span class="muted">126 people • 38 posts • sangat ramai sekarang</span></div></div></div><h2>⚡ LIVE FEED</h2><div class="card"><div class="row"><b>Sunset gila hari ini! 🌅</b><p class="muted">Made Dharma • 2 menit lalu</p></div><div class="row"><b>Ramai banget malam ini 🔥</b><p class="muted">Sara Kim • 5 menit lalu</p></div>'+posts.map(x=>'<div class="row"><b>'+x+'</b><p class="muted">You • baru saja</p></div>').join('')+'</div><h2>🔥 TOP PLACES</h2><div class="card"><div class="row"><span class="score">94</span><b>Canggu Beach</b></div><div class="row"><span class="score">88</span><b>Seminyak</b></div><div class="row"><span class="score">81</span><b>Kuta Beach</b></div></div></div>';
if(t==='near')main.innerHTML='<div class="page"><h2>📍 NEAR YOU</h2><div class="card"><div class="row" onclick="place()"><span class="score">94</span><b>🔥 Canggu Beach<br><span class="muted">2.4 km • 126 people</span></b></div><div class="row" onclick="alert("Seminyak detail segera")"><span class="score">88</span><b>🎵 Seminyak<br><span class="muted">4.1 km • 74 people</span></b></div><div class="row" onclick="alert("Kuta detail segera")"><span class="score">81</span><b>🌅 Kuta Beach<br><span class="muted">7.2 km • 61 people</span></b></div></div></div>';
if(t==='people')main.innerHTML='<div class="page"><h2>👥 PEOPLE ACTIVE NOW</h2><div class="card"><div class="row"><b>🔥 Made Dharma</b><p class="muted">Canggu Beach</p></div><div class="row"><b>🔥 Sara Kim</b><p class="muted">Canggu Beach</p></div><div class="row"><b>🔥 Gus Arya</b><p class="muted">Seminyak</p></div></div></div>';
if(t==='me')main.innerHTML='<div class="page"><h2>👤 ME</h2><div class="card" style="padding:24px;text-align:center"><h2>My NOW</h2><p class="muted">'+posts.length+' posts</p><button class="btn">LOGIN / REGISTER</button></div></div>'}
function place(){main.innerHTML='<div class="page"><button class="back" onclick="show(\'near\')">← Kembali</button><h2>🔥 CANGGU BEACH</h2><div class="card"><div class="hero"><div><span class="badge">NOW SCORE 94</span><h1>126 people active</h1><span class="muted">38 posts • 2.4 km</span></div></div><div class="row"><b>⚡ Live sekarang</b><p class="muted">Sunset, musik, dan aktivitas ramai.</p></div><div class="row"><b>🌅 Sunset gila hari ini!</b><p class="muted">Made Dharma • 2 menit lalu</p></div><div class="row"><b>🔥 Ramai banget malam ini</b><p class="muted">Sara Kim • 5 menit lalu</p></div></div></div>'}
function post(){let x=txt.value.trim();if(!x)return alert('Tulis dulu kejadian');posts.unshift(x);localStorage.setItem('now_posts',JSON.stringify(posts));txt.value='';modal.classList.add('hidden');show('now');alert('🔥 NOW kamu berhasil diposting!')}
plus.onclick=()=>modal.classList.remove('hidden');show('now');
</script></body></html>
