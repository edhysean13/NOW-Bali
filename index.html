const main=document.getElementById("main"),packageModal=document.getElementById("packageModal"),packageBox=document.getElementById("packageBox"),authModal=document.getElementById("authModal"),postModal=document.getElementById("postModal"),detailModal=document.getElementById("detailModal"),profileModal=document.getElementById("profileModal"),authBox=document.getElementById("authBox"),profileBox=document.getElementById("profileBox"),detailBox=document.getElementById("detailBox");

function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"baru saja":m+" min lalu"}
function avatar(u,cls=""){return u?.photo?`<img class="avatar ${cls}" src="${esc(u.photo)}">`:`<div class="avatar ${cls}">${esc((u?.name||"U")[0]?.toUpperCase()||"U")}</div>`}
function profileAvatar(u){const icon=u?.accountType==="driver"?"🚗":u?.accountType==="usaha"?"🏪":"👤";return `<div class="avatarWrap">${avatar(u)}<div class="accountBadge">${icon}</div></div>`}
function accountLabel(t){return t==="driver"?"Driver":t==="usaha"?"UMKM / Usaha":"Personal / Customer"}
async function getProfile(session){if(!session?.user)return null;const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(!p)return null;const u={id:p.id,name:p.name,displayName:p.name,username:p.username,phone:p.phone,accountType:p.account_type,photo:p.avatar_url||""};if(p.account_type==="driver"){const {data:d}=await sb.from("driver_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(d)u.driver={carType:d.vehicle_type,vehicleNumber:d.vehicle_plate,orderPhone:p.phone}}if(p.account_type==="usaha"){const {data:b}=await sb.from("business_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(b)u.business={name:b.business_name,type:b.business_type,address:b.address,phone:p.phone};u.displayName=u.business?.name||u.displayName}return u}
async function syncAccount(session){const a=session.user.user_metadata||{},id=session.user.id,type=a.account_type||"personal",name=a.name||session.user.email?.split("@")[0]||"User",username=a.username||name.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30),phone=a.phone||"";await sb.from("profiles").upsert({id,name,username,phone,account_type:type},{onConflict:"id"});if(type==="driver"){await sb.from("driver_profiles").upsert({profile_id:id,vehicle_type:a.vehicle_type||"",vehicle_plate:a.vehicle_plate||""},{onConflict:"profile_id"})}if(type==="usaha"){await sb.from("business_profiles").upsert({profile_id:id,business_name:a.business_name||"",business_type:a.business_type||"",address:a.business_address||""},{onConflict:"profile_id"})}return await getProfile(session)}
function renderGuest(){document.querySelector("nav").style.display="none";main.innerHTML=`<div class="guestPage"><div class="guestCard"><div class="guestLogo">NOW <span>BALI</span></div><div class="guestTitle">Selamat datang di NOW Bali</div><div class="guestText">Buat akun untuk mengakses Feed, Near, People, Profile, postingan, komentar dan fitur NOW Bali.</div><button class="btn" onclick="openAuth();renderAuth('register')">REGISTER</button><button class="guestLogin" onclick="openAuth();renderAuth('login')">Sudah punya akun? Login</button></div></div>`}
function show(tab="now"){if(!user){renderGuest();return}document.querySelector("nav").style.display="flex";document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="now")renderNow();if(tab==="near")renderNear();if(tab==="people")renderPeople();if(tab==="me")renderMe()}
function postRow(p){return `<div class="row" onclick='openDetail(${JSON.stringify(p)})'>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:``}<div style="flex:1"><h3>${esc(p.t)}</h3><p class="muted">${esc(p.u)} • ${ago(p.time)} • 📍 ${esc(p.place||"Canggu Beach")}</p><span class="tag">🔥 ${p.likes||0}</span><span class="tag">💬 ${(p.comments||[]).length}</span></div></div>`}
function renderNow(){const p=places[0];main.innerHTML=`<div class="page"><div class="title"><h2>🔥 Happening Now</h2><span class="muted">LIVE</span></div><div class="card"><div class="hero"><div class="heroText"><span class="badge">NOW SCORE ${p.score}</span><h1>${p.emoji} ${p.name}</h1><span class="muted">${p.people} people • ${p.posts} posts • sangat ramai sekarang</span></div></div></div><div class="title"><h2>⚡ Live Feed</h2><span class="muted">terbaru</span></div><div class="card">${[{t:"Sunset gila hari ini! 🌅",u:"Made Dharma",time:Date.now()-120000,id:"demo1",likes:12,comments:[{u:"Sari",t:"Bagus banget!"}]},{t:"Ramai banget malam ini 🔥",u:"Sara Kim",time:Date.now()-300000,id:"demo2",likes:8,comments:[]},...posts].slice(0,12).map(postRow).join("")||`<div class="empty">Belum ada postingan.</div>`}</div><div class="title"><h2>🔥 Top Places</h2></div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p.name}')"><span class="score">${p.score}</span><div><h3>${p.emoji} ${p.name}</h3><p class="muted">${p.people} people active • ${p.posts} posts • ${p.distance}</p></div></div>`).join("")}</div></div>`}
function renderNear(){main.innerHTML=`<div class="page"><div class="title"><h2>📍 Near You</h2><span class="muted">Bali</span></div><div class="notice">Lokasi terdekat akan memakai GPS. Untuk sekarang daftar lokasi masih tahap demo.</div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p.name}')"><span class="score">${p.score}</span><div><h3>${p.emoji} ${p.name}</h3><p class="muted">${p.distance} • ${p.people} people active • ${p.posts} posts</p></div></div>`).join("")}</div></div>`}

function renderPeople(){if(user.accountType!=="personal"){main.innerHTML=`<div class="page"><h2>👥 People</h2><div class="notice">Fitur pencarian Driver dan UMKM / Usaha tersedia untuk akun Personal / Customer.</div></div>`;return}main.innerHTML=`<div class="page"><h2>👥 Cari Driver / UMKM</h2><div class="notice">Cari driver untuk order atau cari UMKM / Usaha di NOW BALI.</div><input id="peopleSearch" placeholder="Cari nama, username, usaha, jenis usaha..." oninput="searchPeople()"><div class="filterRow"><button class="filter active" id="f-all" onclick="setSearchType('all')">Semua</button><button class="filter" id="f-driver" onclick="setSearchType('driver')">🚗 Driver</button><button class="filter" id="f-usaha" onclick="setSearchType('usaha')">🏪 UMKM / Usaha</button></div><div id="peopleResults" class="card"><div class="empty">Ketik nama atau pilih kategori untuk mencari.</div></div></div>`}
async function searchPeople(){const q=(val("peopleSearch")||"").toLowerCase();const types=searchType==="all"?["driver","usaha"]:[searchType];const {data,error}=await sb.from("profiles").select("id,name,username,phone,account_type,avatar_url").in("account_type",types).limit(50);if(error){document.getElementById("peopleResults").innerHTML=`<div class="empty">Pencarian gagal: ${esc(error.message)}</div>`;return}const out=[];for(const p of data||[]){let extra={};if(p.account_type==="driver"){const {data:d}=await sb.from("driver_profiles").select("vehicle_type,vehicle_plate").eq("profile_id",p.id).maybeSingle();extra.d=d||{};const {data:pk}=await sb.from("travel_packages").select("*").eq("owner_id",p.id).eq("is_published",true).order("created_at",{ascending:false}).limit(3);extra.packages=pk||[]}else{const {data:b}=await sb.from("business_profiles").select("business_name,business_type,address").eq("profile_id",p.id).maybeSingle();extra.b=b||{}}const hay=`${p.name} ${p.username} ${p.account_type} ${extra.d?.vehicle_type||""} ${extra.b?.business_name||""} ${extra.b?.business_type||""}`.toLowerCase();if(q&&!hay.includes(q))continue;out.push({...p,...extra})}document.getElementById("peopleResults").innerHTML=out.length?out.map(personCard).join(""):`<div class="empty">Tidak ditemukan.</div>`}

function setSearchType(t){searchType=t;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));document.getElementById("f-"+t).classList.add("active");searchPeople()}
function viewPerson(p){const driver=p.account_type==="driver";const name=driver?p.name:(p.detail.business_name||p.name);alert(driver?`Driver: ${name}\nMobil: ${p.detail.vehicle_type||"-"}\nKendaraan: ${p.detail.vehicle_plate||"-"}`:`Usaha: ${name}\nJenis: ${p.detail.business_type||"-"}\nAlamat: ${p.detail.address||"-"}`)}
function renderMe(tab="posts"){if(!user){renderGuest();return}const mine=posts.filter(p=>p.u===user.name).sort((a,b)=>b.time-a.time),type=user.accountType||"personal",extra=type==="driver"&&user.driver?`<div class="driverInfo"><b>🚗 Informasi Driver</b><div class="driverItem"><div><b>${esc(user.driver.carType)}</b><span>Jenis mobil</span></div></div><div class="driverItem"><div><b>${esc(user.driver.vehicleNumber)}</b><span>Nomor kendaraan</span></div></div><div class="driverItem"><div><b>${esc(user.phone)}</b><span>WhatsApp untuk order</span></div>${user.phone?`<a class="waBtn" href="https://wa.me/${user.phone.replace(/\D/g,"")}" target="_blank">WhatsApp</a>`:""}</div></div>`:type==="usaha"&&user.business?`<div class="driverInfo"><b>🏪 Informasi UMKM / Usaha</b><div class="driverItem"><div><b>${esc(user.business.name)}</b><span>Nama usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.type)}</b><span>Jenis usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.address)}</b><span>Alamat usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.phone||user.phone)}</b><span>WhatsApp</span></div></div></div>`:"";main.innerHTML=`<div class="page"><h2>👤 ME</h2><div class="card profileHead">${profileAvatar(user)}<div class="accountLabel">${type==="driver"?"🚗":type==="usaha"?"🏪":"👤"} Akun ${accountLabel(type)}</div><h2>${esc(user.displayName||user.name)}</h2><p class="muted">@${esc(user.username)}</p>${extra}<div class="stats"><div><b>${mine.length}</b><span>POSTS</span></div><div><b>0</b><span>FOLLOWERS</span></div><div><b>0</b><span>FOLLOWING</span></div></div><button class="btn" onclick="editProfile()">EDIT PROFILE</button>${type==="driver"?`<button class="btn secondary" style="margin-top:8px" onclick="openPackage()">➕ ADD PAKET LIBURAN</button>`:""}</div>${type==="driver"?`<div class="packageSectionTitle"><h3>🎒 PAKET LIBURAN SAYA</h3><button class="btn small" onclick="openPackage()">+ Paket</button></div><div id="myPackages" class="card"><div class="empty">Memuat paket...</div></div>`:""}<div class="card"><div class="profileTabs"><button class="profileTab ${tab==="posts"?"active":""}" onclick="renderMe('posts')">📝 POSTS</button><button class="profileTab ${tab==="photos"?"active":""}" onclick="renderMe('photos')">📷 PHOTOS</button></div>${tab==="posts"?(mine.length?mine.map(p=>`<div class="profilePost" onclick='openDetail(${JSON.stringify(p)})'><h3>${esc(p.t)}</h3><p>📍 ${esc(p.place||"Canggu Beach")} • ${ago(p.time)} • 🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</p>${p.photo?`<img class="postPhotoLarge" src="${esc(p.photo)}">`:""}</div>`).join(""):`<div class="empty">Belum ada postingan.<br>Tekan + untuk posting.</div>`):(mine.filter(p=>p.photo).length?`<div class="profileGrid">${mine.filter(p=>p.photo).map(p=>`<div class="photoTile" onclick='openDetail(${JSON.stringify(p)})'><img src="${esc(p.photo)}"><div class="photoMeta">🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</div></div>`).join("")}</div>`:`<div class="empty">Belum ada foto.</div>`)}</div><button class="btn danger" onclick="logout()">LOG OUT</button></div>`;if(type==="driver")loadMyPackages()}

async function loadMyPackages(){const box=document.getElementById("myPackages");if(!box)return;const {data,error}=await sb.from("travel_packages").select("*").eq("owner_id",user.id).order("created_at",{ascending:false});if(error){box.innerHTML=`<div class="empty">Gagal memuat paket: ${esc(error.message)}</div>`;return}box.innerHTML=(data||[]).length?(data||[]).map(packageCard).join(""):`<div class="empty">Belum ada paket.<br>Buat paket pertama kamu.</div>`}
function packageCard(p,owner=false){return `<div class="packageCard">${p.photo_url?`<img class="packagePhoto" src="${esc(p.photo_url)}">`:""}<h3>🎒 ${esc(p.title)}</h3><div class="packagePrice">Rp ${Number(p.price||0).toLocaleString("id-ID")}</div><div class="packageMeta"><span>⏱️ ${esc(p.duration_hours)} jam</span><span>📍 ${p.itinerary?"Itinerary":"Bebas"}</span></div>${p.description?`<div class="packageText">${esc(p.description)}</div>`:""}${p.itinerary?`<div class="packageText"><b>📍 Itinerary</b>
${esc(p.itinerary)}</div>`:""}${p.hotel?`<div class="packageText"><b>🏨 Hotel</b> — ${esc(p.hotel)}</div>`:""}${p.restaurant?`<div class="packageText"><b>🍽️ Restoran</b> — ${esc(p.restaurant)}</div>`:""}<div class="packageActions">${owner?`<button class="btn danger small" onclick="deletePackage('${p.id}')">Hapus</button>`:`<button class="btn small" onclick='contactPackage(${JSON.stringify(p)})'>💬 Hubungi Driver</button>`}</div></div>`}
function openPackage(){if(user?.accountType!=="driver")return alert("Fitur Add Paket hanya untuk akun Driver.");packageModal.classList.remove("hidden");packageBox.innerHTML=`<h2>➕ Add Paket Liburan</h2><div class="notice">Buat paket sendiri. NOW BALI tidak memproses pembayaran; customer menghubungi kamu langsung untuk tanggal dan kesepakatan.</div><input id="pkgTitle" placeholder="Nama Paket — contoh: Bali Explorer"><input id="pkgPrice" type="number" placeholder="Harga (Rp)"><input id="pkgHours" type="number" step="0.5" placeholder="Durasi (jam)"><textarea id="pkgDesc" placeholder="Keterangan paket"></textarea><textarea id="pkgItinerary" placeholder="Itinerary — contoh:
Ke Tanah Lot
Ke Canggu
Ke Uluwatu"></textarea><input id="pkgHotel" placeholder="Hotel (opsional)"><input id="pkgRestaurant" placeholder="Restoran (opsional)"><input id="pkgPhoto" type="url" placeholder="Link foto paket (opsional)"><button class="btn" onclick="savePackage()">TERBITKAN PAKET</button>`}
function closePackage(){packageModal.classList.add("hidden")}
async function savePackage(){const title=val("pkgTitle"),price=Number(val("pkgPrice")||0),hours=Number(val("pkgHours")||0),description=val("pkgDesc"),itinerary=val("pkgItinerary"),hotel=val("pkgHotel"),restaurant=val("pkgRestaurant"),photo=val("pkgPhoto");if(!title)return alert("Nama paket wajib diisi.");if(price<=0)return alert("Harga paket harus diisi.");if(hours<=0)return alert("Durasi paket harus diisi.");const {error}=await sb.from("travel_packages").insert({owner_id:user.id,title,price,duration_hours:hours,description,itinerary,hotel,restaurant,photo_url:photo,is_published:true});if(error)return alert("Paket gagal dibuat: "+error.message);closePackage();renderMe("posts");alert("Paket berhasil diterbitkan.")}
async function deletePackage(id){if(!confirm("Hapus paket ini?"))return;const {error}=await sb.from("travel_packages").delete().eq("id",id);if(error)return alert(error.message);loadMyPackages()}
function contactPackage(p){const phone=user?.phone||"";const text=`Halo, saya tertarik dengan paket ${p.title} Rp ${Number(p.price||0).toLocaleString("id-ID")} / ${p.duration_hours} jam. Saya ingin tanya tanggal dan detailnya.`;if(phone)window.open(`https://wa.me/${phone.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`,"_blank");else alert("Hubungi Driver melalui profilnya untuk menentukan tanggal dan kesepakatan.")}

function editProfile(){profileModal.classList.remove("hidden");profileBox.innerHTML=`<h2>Edit Profile</h2><input id="editName" value="${esc(user.name)}"><input id="editUser" value="${esc(user.username)}"><button class="btn" onclick="saveProfile()">SAVE</button>`}
async function saveProfile(){const name=val("editName")||user.name,username=val("editUser")||user.username;const {error}=await sb.from("profiles").update({name,username}).eq("id",user.id);if(error)return alert(error.message);user.name=name;user.username=username;localStorage.setItem("now_user",JSON.stringify(user));profileModal.classList.add("hidden");show("me")}
function openPost(place="Canggu Beach"){postModal.classList.remove("hidden");document.getElementById("postPlace").value=place}function closePost(){postModal.classList.add("hidden")}
document.getElementById("postPhoto").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoPreview.src=r.result;photoPreview.classList.remove("hidden")};r.readAsDataURL(f)}
function publishPost(){const t=val("postText"),place=val("postPlace")||"Canggu Beach",f=document.getElementById("postPhoto").files[0];if(!t)return alert("Tulis dulu apa yang sedang terjadi.");readImage(f).then(photo=>{posts.unshift({id:"p"+Date.now(),t,u:user?.name||"You",place,time:Date.now(),photo,likes:0,comments:[]});localStorage.setItem("now_posts_v2",JSON.stringify(posts));document.getElementById("postText").value="";document.getElementById("postPhoto").value="";photoPreview.classList.add("hidden");closePost();show("now");alert("🔥 NOW berhasil diposting!")})}
function logout(){sb.auth.signOut();user=null;localStorage.removeItem("now_user");closePost();closeDetail();closeAuth();show("now")}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));document.getElementById("plus").onclick=()=>user?openPost("Canggu Beach"):renderGuest();
(async()=>{const {data}=await sb.auth.getSession();if(data.session){user=await syncAccount(data.session);localStorage.setItem("now_user",JSON.stringify(user));show("now")}else{renderGuest()}})();
</script>
</body>
</html>
