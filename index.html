<body>
<div id="app">

<main id="main"></main>
<nav><button data-tab="now">🔥<small>NOW</small></button><button data-tab="near">📍<small>NEAR</small></button><button id="plus">+</button><button data-tab="people">👥<small>PEOPLE</small></button><button data-tab="me">◉<small>ME</small></button></nav>
<div id="authModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeAuth()">×</button><div id="authBox"></div></div></div>
<div id="postModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closePost()">×</button><h2>Post NOW</h2><textarea id="postText" placeholder="Apa yang sedang terjadi sekarang?"></textarea><select id="postCategory"><option value="">Pilih kategori postingan</option><option value="food">🍜 Makanan & Minuman</option><option value="fashion">👕 Fashion & Retail</option><option value="activity">🏄 Aktivitas & Wisata</option><option value="spa">💆 Spa & Wellness</option><option value="hotel">🏨 Hotel & Villa</option><option value="souvenir">🛍️ Souvenir</option><option value="rental">🚗 Rental</option><option value="beauty">💇 Beauty</option><option value="service">🔧 Jasa</option><option value="art">🎨 Seni & Kreatif</option></select><input id="postPlace" placeholder="Lokasi / tempat" value="Canggu Beach"><input id="postPhoto" type="file" accept="image/*"><img id="photoPreview" class="postPhotoLarge hidden"><button class="btn" onclick="publishPost()">POST NOW</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://wjeyyklbcrqxawoxlphk.supabase.co","sb_publishable_d26AD3NNlXOW3oVuJOgVNg_6vNoSb-E");
const $=id=>document.getElementById(id), main=$("main"); let user=null,activePost=null,searchType="all";
let posts=JSON.parse(localStorage.getItem("now_posts_v2")||"[]").map((p,i)=>({...p,id:p.id||"old"+i,likes:p.likes||0,comments:p.comments||[]}));
const places=[{name:"Canggu Beach",score:94,people:126,posts:38,distance:"2.4 km",emoji:"🔥"},{name:"Seminyak",score:88,people:74,posts:22,distance:"4.1 km",emoji:"🎵"},{name:"Kuta Beach",score:81,people:61,posts:17,distance:"7.2 km",emoji:"🌅"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),val=id=>$(id)?.value.trim()||"",emailOK=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),userOK=v=>/^[A-Za-z0-9_]{3,30}$/.test(v),phoneOK=v=>/^\+?[1-9]\d{7,14}$/.test(String(v).replace(/[\s().-]/g,"")),ago=t=>{let m=Math.floor((Date.now()-t)/60000);return m<1?"baru saja":m+" min lalu"};
function avatar(u,small=false){return u?.photo?`<img class="avatar ${small?"small":""}" src="${esc(u.photo)}">`:`<div class="avatar ${small?"small":""}">${esc((u?.name||"U")[0].toUpperCase())}</div>`}
async function loadProfile(session){if(!session?.user)return null;let {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(!p)return null;let u={id:p.id,name:p.name,displayName:p.name,username:p.username,phone:p.phone,accountType:p.account_type,photo:p.avatar_url||""};if(p.account_type==="driver"){let {data:d}=await sb.from("driver_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(d)u.driver={carType:d.vehicle_type,vehicleNumber:d.vehicle_plate}}if(p.account_type==="usaha"){let {data:b}=await sb.from("business_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(b)u.business={name:b.business_name,type:b.business_type,address:b.address,phone:p.phone};u.displayName=u.business?.name||u.displayName}return u}
async function sync(session){let a=session.user.user_metadata||{},id=session.user.id,type=a.account_type||"personal",name=a.name||session.user.email?.split("@")[0]||"User",username=a.username||name.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30),phone=a.phone||"";await sb.from("profiles").upsert({id,name,username,phone,account_type:type},{onConflict:"id"});if(type==="driver")await sb.from("driver_profiles").upsert({profile_id:id,vehicle_type:a.vehicle_type||"",vehicle_plate:a.vehicle_plate||""},{onConflict:"profile_id"});if(type==="usaha")await sb.from("business_profiles").upsert({profile_id:id,business_name:a.business_name||"",business_type:a.business_type||"",address:a.business_address||""},{onConflict:"profile_id"});return loadProfile(session)}
function guest(){document.querySelector("nav").style.display="none";main.innerHTML=`<div class="guestPage"><div class="guestCard"><div class="guestLogo">NOW <span>BALI</span></div><div class="guestTitle">Selamat datang di NOW Bali</div><div class="guestText">Buat akun untuk mengakses Feed, Near, People, Profile, postingan, komentar dan fitur NOW Bali.</div><button class="btn" onclick="openAuth();renderAuth('register','personal')">REGISTER</button><button class="guestLogin" onclick="openAuth();renderAuth('login')">Sudah punya akun? Login</button></div></div>`}
function show(tab="now"){if(!user)return guest();document.querySelector("nav").style.display="flex";document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({now:renderNow,near:renderNear,people:renderPeople,me:renderMe}[tab]||renderNow)()}
function postRow(p){return `<div class="row" onclick='openDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:``}<div style="flex:1"><h3>${esc(p.t)}</h3><p class="muted">${esc(p.u)} • ${ago(p.time)} • 📍 ${esc(p.place||"Canggu Beach")}</p>${p.category?`<div class="postCategory">🏷️ ${esc(p.category)}</div>`:""}<span class="tag">🔥 ${p.likes||0}</span><span class="tag">💬 ${(p.comments||[]).length}</span></div></div>`}
function renderNow(){let p=places[0],demo=[{id:"demo1",t:"Sunset gila hari ini! 🌅",u:"Made Dharma",time:Date.now()-120000,likes:12,comments:[{u:"Sari",t:"Bagus banget!"}],photo:""},{id:"demo2",t:"Ramai banget malam ini 🔥",u:"Sara Kim",time:Date.now()-300000,likes:8,comments:[],photo:""}];main.innerHTML=`<div class="page"><div class="title"><h2>🔥 Happening Now</h2><span class="muted">LIVE</span></div><div class="card"><div class="hero"><div class="heroText"><span class="badge">NOW SCORE ${p.score}</span><h1>${p.emoji} ${p.name}</h1><span class="muted">${p.people} people • ${p.posts} posts • sangat ramai sekarang</span></div></div></div><div class="title"><h2>⚡ Live Feed</h2></div><div class="card">${[...demo,...posts].slice(0,12).map(postRow).join("")||`<div class="empty">Belum ada postingan.</div>`}</div><div class="title"><h2>🔥 Top Places</h2></div><div class="card">${places.map(x=>`<div class="row" onclick="placeDetail('${x.name}')"><span class="score">${x.score}</span><div><h3>${x.emoji} ${x.name}</h3><p class="muted">${x.people} people active • ${x.posts} posts • ${x.distance}</p></div></div>`).join("")}</div></div>`}
function renderNear(){main.innerHTML=`<div class="page"><h2>📍 Near You</h2><div class="notice">GPS akan kita sambungkan pada tahap berikutnya.</div><div class="card">${places.map(x=>`<div class="row" onclick="placeDetail('${x.name}')"><span class="score">${x.score}</span><div><h3>${x.emoji} ${x.name}</h3><p class="muted">${x.distance} • ${x.people} people active</p></div></div>`).join("")}</div></div>`}
function placeDetail(n){let p=places.find(x=>x.name===n)||places[0];main.innerHTML=`<div class="page"><button class="guestLogin" onclick="show('near')">← Kembali</button><h2>${p.emoji} ${p.name}</h2><div class="card">${posts.filter(x=>(x.place||"Canggu Beach")===p.name).map(postRow).join("")||`<div class="empty">Belum ada postingan di sini.</div>`}<div class="row"><button class="btn" onclick="openPost('${p.name}')">➕ Post di sini</button></div></div></div>`}
let discoverMode="packages";
let discoverPage=0;
let discoverHasMore=true;
let discoverLoading=false;
let discoverDuration="all"; window.__packageCache={};

function renderPeople(){
  if(user.accountType!=="personal"){
    main.innerHTML=`<div class="page"><h2>👥 Discover</h2><div class="notice">Fitur ini digunakan oleh akun Personal / Customer.</div></div>`;
    return;
  }
  main.innerHTML=`<div class="page">
    <h2>🌴 Temukan Liburan Bali</h2>
    <div class="notice">Cari Paket Liburan dari Driver atau temukan UMKM / Usaha.</div>
    <input id="peopleSearch" placeholder="🔍 Cari paket, tempat, hotel..." oninput="resetDiscovery()">
    <div class="filterRow">
      <button id="f-packages" class="filter active" onclick="setType('packages')">🎒 Paket Liburan</button>
      <button id="f-usaha" class="filter" onclick="setType('usaha')">🏪 UMKM / Usaha</button>
    </div>
    <div id="businessPostFilters" class="filterRow" style="display:none">
      <button class="filter active" onclick="setBusinessPostCategory('all',this)">Semua</button>
      <button class="filter" onclick="setBusinessPostCategory('food',this)">🍜 Makanan & Minuman</button><button class="filter" onclick="setBusinessPostCategory('fashion',this)">👕 Fashion & Retail</button><button class="filter" onclick="setBusinessPostCategory('activity',this)">🏄 Aktivitas & Wisata</button><button class="filter" onclick="setBusinessPostCategory('spa',this)">💆 Spa & Wellness</button><button class="filter" onclick="setBusinessPostCategory('hotel',this)">🏨 Hotel & Villa</button><button class="filter" onclick="setBusinessPostCategory('souvenir',this)">🛍️ Souvenir</button><button class="filter" onclick="setBusinessPostCategory('rental',this)">🚗 Rental</button><button class="filter" onclick="setBusinessPostCategory('beauty',this)">💇 Beauty</button><button class="filter" onclick="setBusinessPostCategory('service',this)">🔧 Jasa</button><button class="filter" onclick="setBusinessPostCategory('art',this)">🎨 Seni & Kreatif</button>
    </div>
    <div id="packageFilters" class="filterRow">
      <button class="filter active" onclick="setDuration('all',this)">Semua</button>
      <button class="filter" onclick="setDuration('8',this)">8 Jam</button>
      <button class="filter" onclick="setDuration('24',this)">1 Hari</button>
      <button class="filter" onclick="setDuration('48',this)">2 Hari+</button>
    </div>
    <div id="peopleResults" class="card"><div class="loading">Memuat Paket Liburan...</div></div>
    <div id="loadMoreWrap" style="text-align:center;margin:14px 0"></div>
  </div>`;
  resetDiscovery();
}

function resetDiscovery(){
  if(discoverMode!=="packages"){searchPeople();return;}
  discoverPage=0;
  discoverHasMore=true;
  const box=$("peopleResults");
  const wrap=$("loadMoreWrap");
  if(box)box.innerHTML="";
  if(wrap)wrap.innerHTML="";
  loadMorePackages(true);
}

function setType(t){
  discoverMode=t;
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  const b=$("f-"+t);
  if(b)b.classList.add("active");
  const pf=$("packageFilters"),bf=$("businessPostFilters");
  if(pf)pf.style.display=t==="packages"?"flex":"none";
  if(bf)bf.style.display=t==="usaha"?"flex":"none";
  if(t==="packages")resetDiscovery();
  else {window.__businessPostCategory="all";searchPeople();}
}

function setDuration(v,el){
  discoverDuration=v;
  document.querySelectorAll("#packageFilters .filter").forEach(x=>x.classList.remove("active"));
  if(el)el.classList.add("active");
  resetDiscovery();
}

async function loadMorePackages(first=false){
  if(discoverLoading||!discoverHasMore)return;
  discoverLoading=true;
  const box=$("peopleResults");
  const wrap=$("loadMoreWrap");
  if(!box){discoverLoading=false;return;}

  if(first)box.innerHTML=`<div class="loading">Memuat Paket Liburan...</div>`;
  else if(wrap)wrap.innerHTML=`<div class="loading">Memuat paket berikutnya...</div>`;

  const pageSize=12;
  const from=discoverPage*pageSize;
  const to=from+pageSize-1;

  let query=sb.from("travel_packages")
    .select("id,owner_id,title,price,duration_hours,description,itinerary,hotel,restaurant,photo_url,is_published,created_at,view_count,like_count,comment_count")
    .eq("is_published",true)
    .order("like_count",{ascending:false})
    .order("comment_count",{ascending:false})
    .order("created_at",{ascending:false})
    .range(from,to);

  const raw=(val("peopleSearch")||"").trim().replace(/[(),]/g," ");
  if(raw){
    const s=raw.replace(/\s+/g," ");
    query=query.or(`title.ilike.%${s}%,description.ilike.%${s}%,itinerary.ilike.%${s}%,hotel.ilike.%${s}%,restaurant.ilike.%${s}%`);
  }

  if(discoverDuration==="8")query=query.gte("duration_hours",7).lte("duration_hours",12);
  if(discoverDuration==="24")query=query.gt("duration_hours",12).lte("duration_hours",24);
  if(discoverDuration==="48")query=query.gt("duration_hours",24);

  const pkg=await query;
  if(pkg.error){
    box.innerHTML=`<div class="empty">${esc(pkg.error.message)}</div>`;
    discoverLoading=false;
    return;
  }

  const rows=pkg.data||[];
  discoverHasMore=rows.length===pageSize;
  discoverPage++;

  const ids=[...new Set(rows.map(x=>x.owner_id).filter(Boolean))];
  const pr=ids.length
    ? await sb.from("profiles").select("id,name,username,phone,account_type,avatar_url").in("id",ids)
    : {data:[]};
  const owners=new Map((pr.data||[]).map(x=>[x.id,x]));

  if(first)box.innerHTML="";
  if(!rows.length&&first)box.innerHTML=`<div class="empty">Belum ada Paket Liburan yang cocok.</div>`;

  rows.forEach(p=>{
    const d=owners.get(p.owner_id)||{};
    box.insertAdjacentHTML("beforeend",discoverPackageCard(p,d));
  });

  if(wrap){
    wrap.innerHTML=discoverHasMore
      ? `<button class="btn secondary" onclick="loadMorePackages()">Lihat paket berikutnya</button>`
      : (rows.length?`<div class="muted" style="padding:10px">Semua paket yang cocok sudah ditampilkan.</div>`:"");
  }
  discoverLoading=false;
}

async function searchPeople(){
  if(discoverMode==="packages"){resetDiscovery();return;}
  const box=$("peopleResults"); if(!box)return;
  const q=(val("peopleSearch")||"").toLowerCase();
  const category=window.__businessPostCategory||"all";
  box.innerHTML=`<div class="loading">Memuat postingan UMKM...</div>`;

  let query=sb.from("business_posts")
    .select("id,user_id,caption,image_url,location,category,created_at")
    .order("created_at",{ascending:false})
    .limit(60);
  if(category!=="all")query=query.eq("category",category);

  const r=await query;
  if(r.error){box.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;return;}
  const posts=r.data||[];
  if(!posts.length){box.innerHTML=`<div class="empty">Belum ada postingan UMKM di kategori ini.</div>`;return;}

  const ids=[...new Set(posts.map(x=>x.user_id))];
  const [pr,br]=await Promise.all([
    sb.from("profiles").select("id,name,username,phone,avatar_url").in("id",ids),
    sb.from("business_profiles").select("profile_id,business_name,business_type,address").in("profile_id",ids)
  ]);
  const profiles=new Map((pr.data||[]).map(x=>[x.id,x]));
  const businesses=new Map((br.data||[]).map(x=>[x.profile_id,x]));

  const filtered=posts.filter(x=>{
    const p=profiles.get(x.user_id)||{},b=businesses.get(x.user_id)||{};
    const hay=`${x.caption} ${x.location} ${x.category} ${p.name} ${p.username} ${b.business_name} ${b.business_type} ${b.address}`.toLowerCase();
    return !q||hay.includes(q);
  });

  box.innerHTML=filtered.length
    ? filtered.map(x=>businessPostCard(x,profiles.get(x.user_id)||{},businesses.get(x.user_id)||{})).join("")
    : `<div class="empty">Tidak ada postingan UMKM yang cocok.</div>`;

async function startDriverChat(driver){
  driver=driver||window.__chatDriver||{};
  window.__chatDriver=driver;
  const packageId=window.__activePackage?.id;
  const customerId=user?.id;
  const driverId=driver?.id;

  if(!customerId){alert("Silakan login sebagai Customer terlebih dahulu.");return;}
  if(!driverId){alert("Profil Driver belum memiliki ID yang valid.");return;}
  if(!packageId){alert("Paket belum terhubung dengan Driver.");return;}

  $("profileModal").classList.remove("hidden");
  $("profileBox").innerHTML=`<div class="chatHead">
      <button class="guestLogin" id="chatBackBtn">← Kembali</button>
      <div><h2>💬 Chat ${esc(driver.name||"Driver")}</h2><p class="muted">@${esc(driver.username||"")} • 🚗 Driver</p></div>
    </div>
    <div id="chatMessages" class="chatMessages"><div class="loading">Menghubungkan chat...</div></div>
    <div class="chatComposer">
      <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
      <button id="chatSendBtn" class="action" type="button">Kirim</button>
    </div>
    <div class="notice">Pesan dikirim melalui NOW BALI dan tersimpan di Supabase. Driver dapat menerimanya saat membuka akun Driver.</div>`;

  window.__activeChat={driver,packageId,customerId,conversationId:null,channel:null};

  const back=$("chatBackBtn");
  if(back)back.onclick=()=>openPublicPackage(window.__activePackage||{},driver);
  const send=$("chatSendBtn");
  if(send)send.onclick=sendDriverChat;
  const input=$("chatInput");
  if(input)input.onkeydown=e=>{if(e.key==="Enter")sendDriverChat();};

  // Find or create the conversation for this customer + driver + package.
  let {data:conv,error}=await sb.from("chat_conversations")
    .select("id")
    .eq("customer_id",customerId)
    .eq("driver_id",driverId)
    .eq("package_id",packageId)
    .maybeSingle();

  if(error){$("chatMessages").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return;}

  if(!conv){
    const ins=await sb.from("chat_conversations").insert({
      customer_id:customerId,driver_id:driverId,package_id:packageId
    }).select("id").single();
    conv=ins.data;
    error=ins.error;
    if(error){$("chatMessages").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return;}
  }

  window.__activeChat.conversationId=conv.id;

  const loaded=await sb.from("chat_messages")
    .select("id,sender_id,body,created_at")
    .eq("conversation_id",conv.id)
    .order("created_at",{ascending:true});

  if(loaded.error){$("chatMessages").innerHTML=`<div class="empty">${esc(loaded.error.message)}</div>`;return;}
  renderChatMessages(loaded.data||[]);

  if(window.__chatChannel){try{await sb.removeChannel(window.__chatChannel);}catch(e){}}
  window.__chatChannel=sb.channel(`chat-${conv.id}`)
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"chat_messages",filter:`conversation_id=eq.${conv.id}`},
      payload=>{
        const current=document.querySelectorAll("#chatMessages .chatBubble");
        const existing=[...current].some(x=>x.dataset.id===payload.new.id);
        if(!existing){
          appendChatMessage(payload.new);
        }
      })
    .subscribe();

  setTimeout(()=>{$("chatInput")?.focus();scrollChatToBottom()},50);
}

function renderChatMessages(messages){
  const box=$("chatMessages");
  if(!box)return;
  box.innerHTML=messages.length
    ? messages.map(chatMessageHtml).join("")
    : `<div class="empty">Belum ada pesan. Mulai percakapan dengan Driver.</div>`;
  scrollChatToBottom();
}

function chatMessageHtml(m){
  const mine=m.sender_id===user?.id;
  return `<div class="chatBubble ${mine?"me":"them"}" data-id="${esc(m.id)}">${esc(m.body)}</div>`;
}

function appendChatMessage(m){
  const box=$("chatMessages");
  if(!box)return;
  const empty=box.querySelector(".empty");
  if(empty)empty.remove();
  box.insertAdjacentHTML("beforeend",chatMessageHtml(m));
  scrollChatToBottom();
}

function scrollChatToBottom(){
  const box=$("chatMessages");
  if(box)box.scrollTop=box.scrollHeight;
}

async function sendDriverChat(){
  const input=$("chatInput");
  const chat=window.__activeChat;
  if(!input||!chat?.conversationId)return;
  const text=input.value.trim();
  if(!text)return;

  const btn=$("chatSendBtn");
  if(btn){btn.disabled=true;btn.textContent="Mengirim...";}

  const r=await sb.from("chat_messages").insert({
    conversation_id:chat.conversationId,
    sender_id:user.id,
    body:text
  }).select("id,sender_id,body,created_at").single();

  if(r.error){
    alert("Pesan belum terkirim: "+r.error.message);
  }else{
    input.value="";
    // Realtime normally appends it; append immediately only if subscription has not done so.
    const box=$("chatMessages");
    if(box && !box.querySelector(`[data-id="${r.data.id}"]`))appendChatMessage(r.data);
  }
  if(btn){btn.disabled=false;btn.textContent="Kirim";}
}

  if(input)input.onkeydown=e=>{if(e.key==="Enter")sendDriverChat();};

  window.__chatChannel=sb.channel(`chat-${conversation.id}`)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages",filter:`conversation_id=eq.${conversation.id}`},
      payload=>{const box=$("chatMessages");if(box&&!box.querySelector(`[data-id="${payload.new.id}"]`))appendChatMessage(payload.new);})
    .subscribe();
  setTimeout(()=>input?.focus(),50);
}

async function togglePackageLike(packageId){
  if(!user?.id){alert("Silakan login untuk memberi like.");return;}
  const existing=await sb.from("travel_package_likes").select("id")
    .eq("package_id",packageId).eq("user_id",user.id).maybeSingle();
  if(existing.error){alert(existing.error.message);return;}
  const result=existing.data
    ? await sb.from("travel_package_likes").delete().eq("id",existing.data.id)
    : await sb.from("travel_package_likes").insert({package_id:packageId,user_id:user.id});
  if(result.error){alert(result.error.message);return;}
  const c=await sb.from("travel_packages").select("like_count,comment_count,view_count").eq("id",packageId).single();
  if(c.data){
    if($("packageLikeCount"))$("packageLikeCount").textContent=c.data.like_count||0;
    if($("packageCommentCount"))$("packageCommentCount").textContent=c.data.comment_count||0;
    if($("packageViewCount"))$("packageViewCount").textContent=c.data.view_count||0;
  }
}

async function loadPackageComments(packageId){
  const box=$("packageComments"); if(!box)return;
  const r=await sb.from("travel_package_comments").select("id,user_id,body,created_at")
    .eq("package_id",packageId).order("created_at",{ascending:true}).limit(50);
  if(r.error){box.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;return;}
  if(!r.data?.length){box.innerHTML=`<div class="empty">Belum ada komentar.</div>`;return;}
  const ids=[...new Set(r.data.map(x=>x.user_id))];
  const pr=ids.length?await sb.from("profiles").select("id,name,username").in("id",ids):{data:[]};
  const map=new Map((pr.data||[]).map(x=>[x.id,x]));
  box.innerHTML=r.data.map(c=>{
    const u=map.get(c.user_id)||{};
    return `<div class="comment"><b>${esc(u.name||"User")}</b><div>${esc(c.body)}</div></div>`;
  }).join("");
}

function showPackageCommentBox(packageId){
  if(!user?.id){alert("Silakan login untuk berkomentar.");return;}
  const box=$("packageComments"); if(!box)return;
  if($("packageCommentComposer"))return;
  box.insertAdjacentHTML("afterbegin",`<div id="packageCommentComposer" style="display:flex;gap:8px;margin-bottom:10px">
    <input id="packageCommentInput" placeholder="Tulis komentar..." style="margin:0;flex:1">
    <button class="btn small" id="packageCommentSend" type="button">Kirim</button>
  </div>`);
  $("packageCommentSend").onclick=async()=>{
    const body=$("packageCommentInput")?.value.trim();
    if(!body)return;
    const r=await sb.from("travel_package_comments").insert({package_id:packageId,user_id:user.id,body});
    if(r.error){alert(r.error.message);return;}
    await loadPackageComments(packageId);
    const c=await sb.from("travel_packages").select("comment_count").eq("id",packageId).single();
    if(c.data&&$("packageCommentCount"))$("packageCommentCount").textContent=c.data.comment_count||0;
  };
  $("packageCommentInput")?.focus();
}

function renderMe(tab="posts"){let mine=posts.filter(p=>p.u===user.name).sort((a,b)=>b.time-a.time),type=user.accountType||"personal",icon=type==="driver"?"🚗":type==="usaha"?"🏪":"👤",label=type==="driver"?"Driver":type==="usaha"?"UMKM / Usaha":"Personal / Customer",extra=type==="driver"&&user.driver?`<div class="driverInfo"><b>🚗 Informasi Driver</b><div class="driverItem"><b>${esc(user.driver.carType)}</b><span>Jenis mobil</span></div><div class="driverItem"><b>${esc(user.driver.vehicleNumber)}</b><span>Nomor kendaraan</span></div><div class="driverItem"><b>${esc(user.phone)}</b><span>WhatsApp untuk order</span></div></div>`:type==="usaha"&&user.business?`<div class="driverInfo"><b>🏪 Informasi UMKM / Usaha</b><div class="driverItem"><b>${esc(user.business.name)}</b><span>Nama usaha</span></div><div class="driverItem"><b>${esc(user.business.type)}</b><span>Jenis usaha</span></div><div class="driverItem"><b>${esc(user.business.address)}</b><span>Alamat</span></div></div>`:"";main.innerHTML=`<div class="page"><h2>👤 ME</h2><div class="card profileHead"><div class="avatarWrap">${avatar(user)}<div class="accountBadge">${icon}</div></div><div class="accountLabel">${icon} Akun ${label}</div><h2>${esc(user.displayName||user.name)}</h2><p class="muted">@${esc(user.username)}</p>${extra}<div class="stats"><div><b>${mine.length}</b><span>POSTS</span></div><div><b>0</b><span>FOLLOWERS</span></div><div><b>0</b><span>FOLLOWING</span></div></div><button class="btn" onclick="editProfile()">EDIT PROFILE</button>${type==="driver"?`<button class="btn secondary" style="margin-top:8px" onclick="openPackage()">➕ ADD PAKET LIBURAN</button><button class="btn secondary" style="margin-top:8px" onclick="renderDriverInbox()">💬 PESAN MASUK</button>`:""}</div>${type==="driver"?`<div class="card"><div class="title" style="padding:12px"><h3>🎒 PAKET LIBURAN SAYA</h3><button class="btn small" onclick="openPackage()">+ Paket</button></div><div id="myPackages"><div class="empty">Memuat...</div></div></div>`:""}<div class="card"><div class="profileTabs"><button class="profileTab ${tab==="posts"?"active":""}" onclick="renderMe('posts')">📝 POSTS</button><button class="profileTab ${tab==="photos"?"active":""}" onclick="renderMe('photos')">📷 PHOTOS</button></div>${tab==="posts"?(mine.length?mine.map(postRow).join(""):`<div class="empty">Belum ada postingan.</div>`):(mine.filter(p=>p.photo).length?`<div class="profileGrid">${mine.filter(p=>p.photo).map(p=>`<div class="photoTile" onclick='openDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'><img src="${esc(p.photo)}"><div class="photoMeta">🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</div></div>`).join("")}</div>`:`<div class="empty">Belum ada foto.</div>`)}</div><button class="btn danger" onclick="logout()">LOG OUT</button></div>`;if(type==="driver")loadPackages()}
async function loadPackages(){let box=$("myPackages");if(!box)return;let r=await sb.from("travel_packages").select("*").eq("owner_id",user.id).order("created_at",{ascending:false});if(r.error)return box.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;box.innerHTML=(r.data||[]).length?r.data.map(p=>packageCard(p,true)).join(""):`<div class="empty">Belum ada paket.</div>`}
function packageCard(p,owner,driver=null){return `<div class="packageCard" ${!owner&&driver?`onclick='openPublicPackage(${JSON.stringify(p).replace(/'/g,"&#39;")},${JSON.stringify(driver).replace(/'/g,"&#39;")})'`:``}>${p.photo_url?`<img class="packagePhoto" src="${esc(p.photo_url)}">`:""}<h3>🎒 ${esc(p.title)}</h3><div class="packagePrice">Rp ${Number(p.price||0).toLocaleString("id-ID")}</div><div class="packageMeta"><span>⏱️ ${esc(p.duration_hours)} jam</span></div>${p.description?`<div class="packageText">${esc(p.description)}</div>`:""}${p.itinerary?`<div class="packageText"><b>📍 Itinerary</b>\n${esc(p.itinerary)}</div>`:""}${p.hotel?`<div class="packageText"><b>🏨 Hotel</b> — ${esc(p.hotel)}</div>`:""}${p.restaurant?`<div class="packageText"><b>🍽️ Restoran</b> — ${esc(p.restaurant)}</div>`:""}<div class="packageActions">${owner?`<button class="btn danger small" onclick="deletePackage('${p.id}')">Hapus</button>`:`<button class="btn small" onclick='contactPackage(${JSON.stringify(p).replace(/'/g,"&#39;")},${JSON.stringify(driver||{}).replace(/'/g,"&#39;")})'>💬 Hubungi Driver</button>`}</div></div>`}
function openPackage(){if(user.accountType!=="driver")return alert("Fitur ini hanya untuk akun Driver.");$("packageModal").classList.remove("hidden");$("packageBox").innerHTML=`<h2>➕ Add Paket Liburan</h2><div class="notice">Tidak ada pembayaran di NOW BALI. Customer menghubungi Driver langsung.</div><input id="pkgTitle" placeholder="Nama Paket"><input id="pkgPrice" type="number" placeholder="Harga (Rp)"><input id="pkgHours" type="number" step=".5" placeholder="Durasi (jam)"><textarea id="pkgDesc" placeholder="Keterangan"></textarea><textarea id="pkgItinerary" placeholder="Itinerary — Tempat A\nTempat B\nTempat C"></textarea><input id="pkgHotel" placeholder="Hotel (opsional)"><input id="pkgRestaurant" placeholder="Restoran (opsional)"><input id="pkgPhoto" type="url" placeholder="Link foto (opsional)"><button class="btn" onclick="savePackage()">TERBITKAN PAKET</button>`}
function closePackage(){$("packageModal").classList.add("hidden")}
async function savePackage(){let title=val("pkgTitle"),price=+val("pkgPrice"),hours=+val("pkgHours"),description=val("pkgDesc"),itinerary=val("pkgItinerary"),hotel=val("pkgHotel"),restaurant=val("pkgRestaurant"),photo=val("pkgPhoto");if(!title||price<=0||hours<=0)return alert("Nama paket, harga dan durasi wajib diisi.");let r=await sb.from("travel_packages").insert({owner_id:user.id,title,price,duration_hours:hours,description,itinerary,hotel,restaurant,photo_url:photo,is_published:true});if(r.error)return alert("Paket gagal dibuat: "+r.error.message);closePackage();renderMe();alert("Paket berhasil diterbitkan.")}
async function deletePackage(id){if(!confirm("Hapus paket ini?"))return;let r=await sb.from("travel_packages").delete().eq("id",id);if(r.error)alert(r.error.message);else loadPackages()}
function contactPackage(p,driver){const phone=driver?.phone||"";if(!phone)return alert("Nomor WhatsApp Driver belum tersedia.");let text=`Halo, saya tertarik dengan paket ${p.title}. Saya ingin tanya tanggal dan detailnya.`;window.open(`https://wa.me/${phone.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`,"_blank")}
function openDetail(p){activePost={...p,likes:p.likes||0,comments:p.comments||[],liked:false};$("detailModal").classList.remove("hidden");renderDetail()}
function closeDetail(){$("detailModal").classList.add("hidden");activePost=null}
function renderDetail(){let p=activePost;$("detailBox").innerHTML=`<p class="muted">📍 ${esc(p.place||"Canggu Beach")} • ${ago(p.time)}</p><h2>${esc(p.u||"You")}</h2><div style="font-size:17px;line-height:1.45">${esc(p.t||"")}</div>${p.photo?`<img class="postPhotoLarge" src="${esc(p.photo)}">`:""}<div class="actions"><button class="action ${p.liked?"liked":""}" onclick="likePost()">🔥 ${p.likes||0}</button><button class="action" onclick="$('commentInput').focus()">💬 ${(p.comments||[]).length}</button><button class="action" onclick="sharePost()">↗️ Bagikan</button></div><div style="display:flex;gap:8px"><input id="commentInput" placeholder="Tulis komentar..." style="margin:0"><button class="btn small" onclick="addComment()">KIRIM</button></div><h3>Komentar</h3>${p.comments?.length?p.comments.map(c=>`<div class="comment"><b>${esc(c.u)}</b><div class="muted">${esc(c.t)}</div></div>`).join(""):`<div class="empty">Belum ada komentar.</div>`}`}
function likePost(){activePost.liked=!activePost.liked;activePost.likes=Math.max(0,(activePost.likes||0)+(activePost.liked?1:-1));let i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].likes=activePost.likes;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function addComment(){let t=val("commentInput");if(!t)return;activePost.comments.push({u:user.name,t});let i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].comments=activePost.comments;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function sharePost(){if(navigator.share)navigator.share({title:"NOW BALI",text:`${activePost.t} — NOW BALI`}).catch(()=>{});else alert("Posting siap dibagikan.")}
function openPost(place="Canggu Beach"){$("postModal").classList.remove("hidden");$("postPlace").value=place;$("postCategory").value=""}function closePost(){$("postModal").classList.add("hidden")}
$("postPhoto").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$("photoPreview").src=r.result;$("photoPreview").classList.remove("hidden")};r.readAsDataURL(f)}
async function publishPost(){
  let t=val("postText"),category=val("postCategory"),place=val("postPlace")||"Canggu Beach",f=$("postPhoto").files[0];
  if(!t)return alert("Tulis dulu apa yang sedang terjadi.");
  if(!category)return alert("Pilih kategori postingan terlebih dahulu.");

  let done=async photo=>{
    // Keep the existing Live Feed behavior.
    posts.unshift({id:"p"+Date.now(),t,u:user.name,place,category,time:Date.now(),photo,likes:0,comments:[]});
    localStorage.setItem("now_posts_v2",JSON.stringify(posts));

    // UMKM posts are also persisted to Supabase so every Customer can discover them in PEOPLE.
    if(user?.accountType==="usaha"){
      const r=await sb.from("business_posts").insert({
        user_id:user.id,caption:t,image_url:photo||"",location:place,category
      });
      if(r.error)return alert("Postingan tersimpan di Feed lokal, tetapi gagal masuk PEOPLE: "+r.error.message);
    }

    $("postText").value="";$("postCategory").value="";$("postPhoto").value="";
    $("photoPreview").classList.add("hidden");closePost();show("now");
  };

  if(f){
    if(f.size>8*1024*1024)return alert("Foto maksimal 8 MB.");
    let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f);
  }else done("");
}
function openAuth(){ $("authModal").classList.remove("hidden")}function closeAuth(){$("authModal").classList.add("hidden")}
function renderAuth(mode="login",type="personal"){if(mode==="login"){authBox.innerHTML=`<h2>Login ke NOW</h2><div class="notice">Gunakan email yang sudah diverifikasi.</div><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">LOGIN</button><p class="muted" style="text-align:center">Belum punya akun? <button class="guestLogin" onclick="renderAuth('register','personal')">Register</button></p>`;return}let extra=type==="driver"?`<input id="car" placeholder="Jenis Mobil"><input id="plate" placeholder="Nomor Kendaraan"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:type==="usaha"?`<input id="bn" placeholder="Nama Usaha"><input id="bt" placeholder="Jenis Usaha"><input id="ba" placeholder="Alamat Usaha"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:`<input id="phone" type="tel" placeholder="Nomor WhatsApp">`;authBox.innerHTML=`<h2>Buat akun NOW</h2><div class="notice">Semua akun gratis.</div><div class="accountChoices"><button class="accountChoice ${type==="personal"?"active":""}" onclick="renderAuth('register','personal')"><span>👤</span>Personal</button><button class="accountChoice ${type==="driver"?"active":""}" onclick="renderAuth('register','driver')"><span>🚗</span>Driver</button><button class="accountChoice ${type==="usaha"?"active":""}" onclick="renderAuth('register','usaha')"><span>🏪</span>UMKM</button></div><input id="regName" placeholder="Nama"><input id="regUsername" placeholder="Username (unik)"><input id="regEmail" type="email" placeholder="Email">${extra}<input id="regPassword" type="password" placeholder="Password (min. 6 karakter)"><button class="btn" onclick="doRegister('${type}')">REGISTER</button><p class="muted" style="text-align:center">Sudah punya akun? <button class="guestLogin" onclick="renderAuth('login')">Login</button></p>`}
async function doLogin(){let email=val("loginEmail").toLowerCase(),password=$("loginPassword").value;if(!emailOK(email))return alert("Email salah atau tidak valid.");let r=await sb.auth.signInWithPassword({email,password});if(r.error)return alert(r.error.message);user=await sync(r.data.session);if(!user)return alert("Profil belum tersedia.");closeAuth();show("now")}
async function doRegister(type){let name=val("regName"),un=val("regUsername"),email=val("regEmail").toLowerCase(),pw=$("regPassword").value;if(!name)return alert("Isi Nama dulu.");if(!userOK(un))return alert("Username 3–30 karakter, hanya huruf, angka dan underscore.");if(!emailOK(email))return alert("Email salah atau tidak valid.");if(pw.length<6)return alert("Password minimal 6 karakter.");let phone=val("phone").replace(/[\s().-]/g,"");if(!phoneOK(phone))return alert("Nomor WhatsApp tidak valid.");let dup=await sb.from("profiles").select("id").ilike("username",un).limit(1);if(dup.data?.length)return alert("Username sudah digunakan.");let meta={name,username:un,account_type:type,phone};if(type==="driver"){if(!val("car")||!val("plate"))return alert("Lengkapi data Driver.");meta.vehicle_type=val("car");meta.vehicle_plate=val("plate")}if(type==="usaha"){if(!val("bn")||!val("bt")||!val("ba"))return alert("Lengkapi data UMKM / Usaha.");meta.business_name=val("bn");meta.business_type=val("bt");meta.business_address=val("ba")}let r=await sb.auth.signUp({email,password:pw,options:{data:meta,emailRedirectTo:location.origin}});if(r.error){if(/invalid.*email|email.*valid/i.test(r.error.message))return alert("Email salah atau tidak valid.");return alert(r.error.message)}if(!r.data.session){alert("Registrasi berhasil. Silakan konfirmasi email melalui link yang dikirim ke email kamu.");renderAuth("login")}else{user=await sync(r.data.session);closeAuth();show("now")}}
function editProfile(){
  $("profileModal").classList.remove("hidden");
  $("profileBox").innerHTML=`<h2>Edit Profile</h2>
    <div style="text-align:center;margin:12px 0">
      <div id="editAvatarPreview">${avatar(user)}</div>
      <label class="btn secondary" style="display:inline-block;margin-top:10px;cursor:pointer">
        📷 Ganti Foto
        <input id="editAvatarFile" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
      </label>
    </div>
    <input id="editName" value="${esc(user.name)}" placeholder="Nama">
    <input id="editUsername" value="${esc(user.username)}" placeholder="Username">
    <button class="btn" id="saveProfileBtn">SAVE</button>
    <div id="editProfileStatus" class="muted" style="text-align:center;margin-top:8px"></div>`;

  $("editAvatarFile").onchange=()=>{
    const file=$("editAvatarFile").files?.[0];
    if(!file)return;
    if(file.size>5*1024*1024)return alert("Foto maksimal 5 MB.");
    const reader=new FileReader();
    reader.onload=()=>{$("editAvatarPreview").innerHTML=`<img class="avatar" src="${reader.result}">`;};
    reader.readAsDataURL(file);
  };
  $("saveProfileBtn").onclick=saveProfile;
}

async function saveProfile(){
  const btn=$("saveProfileBtn"),status=$("editProfileStatus");
  let name=val("editName")||user.name,un=val("editUsername")||user.username;
  if(!userOK(un))return alert("Username tidak valid.");
  let dup=await sb.from("profiles").select("id").ilike("username",un).neq("id",user.id).limit(1);
  if(dup.error)return alert(dup.error.message);
  if(dup.data?.length)return alert("Username sudah digunakan.");

  btn.disabled=true;
  if(status)status.textContent="Menyimpan...";
  let avatarUrl=user.photo||"";
  const file=$("editAvatarFile")?.files?.[0];

  if(file){
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
    const path=`${user.id}/avatar.${ext}`;
    const up=await sb.storage.from("avatars").upload(path,file,{upsert:true,contentType:file.type});
    if(up.error){
      btn.disabled=false;
      if(status)status.textContent="";
      return alert("Foto gagal diupload: "+up.error.message);
    }
    avatarUrl=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+`?v=${Date.now()}`;
  }

  const r=await sb.from("profiles").update({name,username:un,avatar_url:avatarUrl}).eq("id",user.id);
  if(r.error){
    btn.disabled=false;
    if(status)status.textContent="";
    return alert(r.error.message);
  }

  user.name=name;
  user.displayName=user.accountType==="usaha"&&user.business?.name?user.business.name:name;
  user.username=un;
  user.photo=avatarUrl;

  $("profileModal").classList.add("hidden");
  show("me");
}
function closeProfile(){$("profileModal").classList.add("hidden")}
function logout(){sb.auth.signOut();user=null;localStorage.removeItem("now_user");show()}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));$("plus").onclick=()=>user?openPost():guest();
(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=await sync(r.data.session);show("now")}else guest()})();
