<style>

.page{padding:15px}.title{display:flex;justify-content:space-between;align-items:center}.title h2{font-size:14px;text-transform:uppercase;margin:10px 0}.muted{color:#8d95a8;font-size:11px}.card{background:#12151e;border:1px solid #282d39;border-radius:18px;margin:12px 0;overflow:hidden}.hero{height:190px;background:linear-gradient(#0000,#000d),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80") center/cover;position:relative}.heroText{position:absolute;left:14px;bottom:14px}.badge{background:linear-gradient(90deg,#ff3fa4,#ff7438);padding:6px 10px;border-radius:99px;font-size:10px;font-weight:800}.hero h1{margin:8px 0 3px}.row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #242935;align-items:center}.row:last-child{border:0}.row h3{margin:0 0 4px;font-size:14px}.row p{margin:0}.score{font-size:21px;font-weight:900;color:#ff7846;min-width:42px;text-align:center}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#202531}

input,textarea{width:100%;background:#090c13;color:#fff;border:1px solid #303543;border-radius:13px;padding:12px;margin:7px 0;outline:none}textarea{height:110px;resize:none}.photoPreview,.postPhotoLarge{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-top:10px}.notice{padding:11px;border-radius:12px;background:#171c27;color:#aeb5c4;font-size:11px;margin:10px 0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#202632;color:#cdd2dd;font-size:10px;margin:2px}.empty{text-align:center;padding:30px 15px;color:#8991a4;font-size:12px}
.profileHead{text-align:center;padding:22px}.avatar{width:88px;height:88px;border-radius:50%;background:#222733;border:2px solid #ff5a9f;display:grid;place-items:center;margin:auto;font-size:28px;object-fit:cover}.avatar.small{width:52px;height:52px;font-size:18px}.avatarWrap{width:108px;height:108px;margin:auto;position:relative;display:grid;place-items:center}.avatarWrap .avatar{width:88px;height:88px}.accountBadge{position:absolute;right:0;bottom:2px;width:38px;height:38px;border-radius:50%;background:#1a202b;border:3px solid #ff5b8f;display:grid;place-items:center;font-size:22px}.accountLabel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 11px;border-radius:99px;background:#202632;border:1px solid #343b4b;font-size:11px;font-weight:800}.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}.stats b{display:block;font-size:18px}.stats span{font-size:10px;color:#8991a4}.driverInfo{margin-top:16px;text-align:left;background:#0d1119;border:1px solid #2b3240;border-radius:16px;padding:14px}.driverItem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #242a35}.driverItem:last-child{border:0}.driverItem div{flex:1}.driverItem b{display:block;font-size:12px}.driverItem span{display:block;color:#8d95a8;font-size:10px;margin-top:2px}.waBtn{display:inline-block;background:#183d2a;color:#69e7a0;border:1px solid #286545;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800;text-decoration:none}.profileTabs{display:flex;border-bottom:1px solid #2a3040;margin:12px 0}.profileTab{flex:1;padding:13px 6px;background:none;border:0;color:#8991a4;font-weight:800}.profileTab.active{color:#ff5a9f;border-bottom:2px solid #ff5a9f}.profilePost{padding:14px;border-bottom:1px solid #252b36;cursor:pointer}.profilePost h3{margin:0 0 5px;font-size:14px}.profilePost p{margin:0;color:#9da5b5;font-size:11px}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.profileGrid img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}.photoTile{position:relative;cursor:pointer}.photoMeta{position:absolute;left:5px;bottom:5px;background:#090b12dd;border-radius:10px;padding:4px 7px;font-size:10px}.actions{display:flex;gap:8px;margin:12px 0}.action{flex:1;border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:12px;padding:10px}.action.liked{color:#ff7043;border-color:#ff7043}.comment{padding:10px 0;border-bottom:1px solid #252b36}.searchbar{position:relative}.filterRow{display:flex;gap:8px;overflow:auto;margin:8px 0}.filter{border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:99px;padding:8px 12px;font-size:11px;white-space:nowrap}.filter.active{border-color:#ff5a9f;color:#ff7ab5}.personCard{padding:14px;border-bottom:1px solid #252b36}.personTop{display:flex;gap:12px;align-items:center}.personMeta{flex:1}.personMeta h3{margin:0 0 3px;font-size:14px}.personMeta p{margin:0}.personActions{display:flex;gap:8px;margin-top:10px}.guestPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}.guestCard{width:100%;background:#12151e;border:1px solid #282d39;border-radius:26px;padding:34px 22px;text-align:center}.guestLogo{font-size:46px;font-weight:950}.guestLogo span{color:#ff7438}.guestTitle{font-size:23px;font-weight:900;margin:20px 0 8px}.guestText{color:#8d95a8;font-size:12px;line-height:1.5;margin-bottom:22px}.guestLogin{border:0;background:none;color:#ff6a9e;font-weight:800;padding:12px}.accountChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.accountChoice{border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:14px;padding:14px 8px;text-align:center;font-weight:800}.accountChoice.active{border-color:#ff5a9f;background:#2b1b2a}.accountChoice span{display:block;font-size:24px;margin-bottom:5px}.formSection{padding:12px 0;border-top:1px solid #252b36;margin-top:10px}.formSection h3{margin:0 0 5px;font-size:13px}
</style>

<body>
<div id="app">
<header><div class="logo">NOW <span>BALI</span></div><div class="live">● LIVE</div></header>
<main id="main"></main>
<nav><button data-tab="now">🔥<small>NOW</small></button><button data-tab="near">📍<small>NEAR</small></button><button id="plus">+</button><button data-tab="people">👥<small>PEOPLE</small></button><button data-tab="me">◉<small>ME</small></button></nav>
<div id="postModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closePost()">×</button><h2>Post NOW</h2><div class="muted">📍 Canggu Beach</div><textarea id="postText" placeholder="Apa yang sedang terjadi sekarang?"></textarea><input id="postPlace" placeholder="Lokasi / tempat" value="Canggu Beach"><label class="btn secondary" style="display:block;text-align:center;margin:7px 0">📷 Tambah foto <input id="postPhoto" type="file" accept="image/*" style="display:none"></label><img id="photoPreview" class="photoPreview hidden"><button class="btn" onclick="publishPost()">POST NOW</button></div></div>

<div id="authModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeAuth()">×</button><div id="authBox"></div></div></div>

</div>

<script>
const SB_URL="https://wjeyyklbcrqxawoxlphk.supabase.co",SB_KEY="sb_publishable_d26AD3NNlXOW3oVuJOgVNg_6vNoSb-E",sb=window.supabase.createClient(SB_URL,SB_KEY);
const main=document.getElementById("main"),authModal=document.getElementById("authModal"),postModal=document.getElementById("postModal"),detailModal=document.getElementById("detailModal"),profileModal=document.getElementById("profileModal"),authBox=document.getElementById("authBox"),profileBox=document.getElementById("profileBox"),detailBox=document.getElementById("detailBox");
let user=null,posts=JSON.parse(localStorage.getItem("now_posts_v2")||"[]").map((p,i)=>({...p,id:p.id||"old"+i,likes:p.likes||0,comments:p.comments||[]})),activePost=null,searchType="all";
const places=[{name:"Canggu Beach",score:94,people:126,posts:38,distance:"2.4 km",emoji:"🔥"},{name:"Seminyak",score:88,people:74,posts:22,distance:"4.1 km",emoji:"🎵"},{name:"Kuta Beach",score:81,people:61,posts:17,distance:"7.2 km",emoji:"🌅"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),val=id=>document.getElementById(id)?.value.trim()||"",emailOK=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),userOK=v=>/^[A-Za-z0-9_]{3,30}$/.test(v),phoneOK=v=>/^\+?[1-9]\d{7,14}$/.test(String(v).replace(/[\s().-]/g,""));
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"baru saja":m+" min lalu"}
function avatar(u,cls=""){return u?.photo?`<img class="avatar ${cls}" src="${esc(u.photo)}">`:`<div class="avatar ${cls}">${esc((u?.name||"U")[0]?.toUpperCase()||"U")}</div>`}
function profileAvatar(u){const icon=u?.accountType==="driver"?"🚗":u?.accountType==="usaha"?"🏪":"👤";return `<div class="avatarWrap">${avatar(u)}<div class="accountBadge">${icon}</div></div>`}
function accountLabel(t){return t==="driver"?"Driver":t==="usaha"?"UMKM / Usaha":"Personal / Customer"}
async function getProfile(session){if(!session?.user)return null;const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(!p)return null;const u={id:p.id,name:p.name,displayName:p.name,username:p.username,phone:p.phone,accountType:p.account_type,photo:p.avatar_url||""};if(p.account_type==="driver"){const {data:d}=await sb.from("driver_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(d)u.driver={carType:d.vehicle_type,vehicleNumber:d.vehicle_plate,orderPhone:p.phone}}if(p.account_type==="usaha"){const {data:b}=await sb.from("business_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(b)u.business={name:b.business_name,type:b.business_type,address:b.address,phone:p.phone};u.displayName=u.business?.name||u.displayName}return u}
async function syncAccount(session){const a=session.user.user_metadata||{},id=session.user.id,type=a.account_type||"personal",name=a.name||session.user.email?.split("@")[0]||"User",username=a.username||name.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30),phone=a.phone||"";await sb.from("profiles").upsert({id,name,username,phone,account_type:type},{onConflict:"id"});if(type==="driver"){await sb.from("driver_profiles").upsert({profile_id:id,vehicle_type:a.vehicle_type||"",vehicle_plate:a.vehicle_plate||""},{onConflict:"profile_id"})}if(type==="usaha"){await sb.from("business_profiles").upsert({profile_id:id,business_name:a.business_name||"",business_type:a.business_type||"",address:a.business_address||""},{onConflict:"profile_id"})}return await getProfile(session)}
function renderGuest(){document.querySelector("nav").style.display="none";main.innerHTML=`<div class="guestPage"><div class="guestCard"><div class="guestLogo">NOW <span>BALI</span></div><div class="guestTitle">Selamat datang di NOW Bali</div><div class="guestText">Buat akun untuk mengakses Feed, Near, People, Profile, postingan, komentar dan fitur NOW Bali.</div><button class="btn" onclick="openAuth();renderAuth('register')">REGISTER</button><button class="guestLogin" onclick="openAuth();renderAuth('login')">Sudah punya akun? Login</button></div></div>`}
function show(tab="now"){if(!user){renderGuest();return}document.querySelector("nav").style.display="flex";document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="now")renderNow();if(tab==="near")renderNear();if(tab==="people")renderPeople();if(tab==="me")renderMe()}
function postRow(p){return `<div class="row" onclick='openDetail(${JSON.stringify(p)})'>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:``}<div style="flex:1"><h3>${esc(p.t)}</h3><p class="muted">${esc(p.u)} • ${ago(p.time)} • 📍 ${esc(p.place||"Canggu Beach")}</p><span class="tag">🔥 ${p.likes||0}</span><span class="tag">💬 ${(p.comments||[]).length}</span></div></div>`}
function renderNow(){const p=places[0];main.innerHTML=`<div class="page"><div class="title"><h2>🔥 Happening Now</h2><span class="muted">LIVE</span></div><div class="card"><div class="hero"><div class="heroText"><span class="badge">NOW SCORE ${p.score}</span><h1>${p.emoji} ${p.name}</h1><span class="muted">${p.people} people • ${p.posts} posts • sangat ramai sekarang</span></div></div></div><div class="title"><h2>⚡ Live Feed</h2><span class="muted">terbaru</span></div><div class="card">${[{t:"Sunset gila hari ini! 🌅",u:"Made Dharma",time:Date.now()-120000,id:"demo1",likes:12,comments:[{u:"Sari",t:"Bagus banget!"}]},{t:"Ramai banget malam ini 🔥",u:"Sara Kim",time:Date.now()-300000,id:"demo2",likes:8,comments:[]},...posts].slice(0,12).map(postRow).join("")||`<div class="empty">Belum ada postingan.</div>`}</div><div class="title"><h2>🔥 Top Places</h2></div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p.name}')"><span class="score">${p.score}</span><div><h3>${p.emoji} ${p.name}</h3><p class="muted">${p.people} people active • ${p.posts} posts • ${p.distance}</p></div></div>`).join("")}</div></div>`}
function renderNear(){main.innerHTML=`<div class="page"><div class="title"><h2>📍 Near You</h2><span class="muted">Bali</span></div><div class="notice">Lokasi terdekat akan memakai GPS. Untuk sekarang daftar lokasi masih tahap demo.</div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p.name}')"><span class="score">${p.score}</span><div><h3>${p.emoji} ${p.name}</h3><p class="muted">${p.distance} • ${p.people} people active • ${p.posts} posts</p></div></div>`).join("")}</div></div>`}
function placeDetail(name){const p=places.find(x=>x.name===name)||places[0];main.innerHTML=`<div class="page"><button class="guestLogin" onclick="show('near')">← Kembali</button><h2>${p.emoji} ${p.name}</h2><div class="card"><div class="hero"><div class="heroText"><span class="badge">NOW SCORE ${p.score}</span><h1>${p.people} people active</h1><span class="muted">${p.posts} posts • ${p.distance}</span></div></div>${posts.filter(x=>(x.place||"Canggu Beach")===p.name).slice(0,8).map(postRow).join("")}<div class="row"><button class="btn" onclick="openPost('${p.name}')">➕ Post di sini</button></div></div></div>`}
function renderPeople(){if(user.accountType!=="personal"){main.innerHTML=`<div class="page"><h2>👥 People</h2><div class="notice">Fitur pencarian Driver dan UMKM / Usaha tersedia untuk akun Personal / Customer.</div></div>`;return}main.innerHTML=`<div class="page"><h2>👥 Cari Driver / UMKM</h2><div class="notice">Cari driver untuk order atau cari UMKM / Usaha di NOW BALI.</div><input id="peopleSearch" placeholder="Cari nama, username, usaha, jenis usaha..." oninput="searchPeople()"><div class="filterRow"><button class="filter active" id="f-all" onclick="setSearchType('all')">Semua</button><button class="filter" id="f-driver" onclick="setSearchType('driver')">🚗 Driver</button><button class="filter" id="f-usaha" onclick="setSearchType('usaha')">🏪 UMKM / Usaha</button></div><div id="peopleResults" class="card"><div class="empty">Ketik nama atau pilih kategori untuk mencari.</div></div></div>`}
async function searchPeople(){const q=val("peopleSearch").toLowerCase();let query=sb.from("profiles").select("id,name,username,phone,account_type,photo").in("account_type",searchType==="all"?["driver","usaha"]:[searchType]).limit(50);const {data,error}=await query;if(error){document.getElementById("peopleResults").innerHTML=`<div class="empty">Pencarian belum tersedia: ${esc(error.message)}</div>`;return}let rows=(data||[]).filter(x=>!q||[x.name,x.username,x.account_type].join(" ").toLowerCase().includes(q));let out=[];for(const p of rows){if(p.account_type==="driver"){const {data:d}=await sb.from("driver_profiles").select("vehicle_type,vehicle_plate").eq("profile_id",p.id).maybeSingle();out.push({...p,detail:d||{}})}else{const {data:b}=await sb.from("business_profiles").select("business_name,business_type,address,photo").eq("profile_id",p.id).maybeSingle();out.push({...p,detail:b||{}})}}document.getElementById("peopleResults").innerHTML=out.length?out.map(personCard).join(""):`<div class="empty">Tidak ditemukan.</div>`}
function personCard(p){const driver=p.account_type==="driver",name=driver?p.name:(p.detail.business_name||p.name),sub=driver?`${p.detail.vehicle_type||"Driver"} • ${p.detail.vehicle_plate||"Nomor kendaraan belum diisi"}`:`${p.detail.business_type||"UMKM / Usaha"} • ${p.detail.address||"Alamat belum diisi"}`,phone=p.phone||"";return `<div class="personCard"><div class="personTop">${avatar({name,photo:driver?p.photo:p.detail.photo},"small")}<div class="personMeta"><h3>${esc(name)}</h3><p class="muted">@${esc(p.username||"")} • ${driver?"🚗 Driver":"🏪 UMKM / Usaha"}</p><p class="muted">${esc(sub)}</p></div></div><div class="personActions">${phone?`<a class="waBtn" href="https://wa.me/${phone.replace(/\D/g,"")}" target="_blank">WhatsApp / Order</a>`:""}<button class="btn secondary small" onclick='viewPerson(${JSON.stringify(p)})'>LIHAT PROFIL</button></div></div>`}
function setSearchType(t){searchType=t;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));document.getElementById("f-"+t).classList.add("active");searchPeople()}
function viewPerson(p){const driver=p.account_type==="driver";const name=driver?p.name:(p.detail.business_name||p.name);alert(driver?`Driver: ${name}\nMobil: ${p.detail.vehicle_type||"-"}\nKendaraan: ${p.detail.vehicle_plate||"-"}`:`Usaha: ${name}\nJenis: ${p.detail.business_type||"-"}\nAlamat: ${p.detail.address||"-"}`)}
function renderMe(tab="posts"){if(!user){renderGuest();return}const mine=posts.filter(p=>p.u===user.name).sort((a,b)=>b.time-a.time),type=user.accountType||"personal",extra=type==="driver"&&user.driver?`<div class="driverInfo"><b>🚗 Informasi Driver</b><div class="driverItem"><div><b>${esc(user.driver.carType)}</b><span>Jenis mobil</span></div></div><div class="driverItem"><div><b>${esc(user.driver.vehicleNumber)}</b><span>Nomor kendaraan</span></div></div><div class="driverItem"><div><b>${esc(user.phone)}</b><span>WhatsApp untuk order</span></div>${user.phone?`<a class="waBtn" href="https://wa.me/${user.phone.replace(/\D/g,"")}" target="_blank">WhatsApp</a>`:""}</div></div>`:type==="usaha"&&user.business?`<div class="driverInfo"><b>🏪 Informasi UMKM / Usaha</b><div class="driverItem"><div><b>${esc(user.business.name)}</b><span>Nama usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.type)}</b><span>Jenis usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.address)}</b><span>Alamat</span></div></div><div class="driverItem"><div><b>${esc(user.business.phone||user.phone)}</b><span>WhatsApp</span></div></div></div>`:"";main.innerHTML=`<div class="page"><h2>👤 ME</h2><div class="card profileHead">${profileAvatar(user)}<div class="accountLabel">${type==="driver"?"🚗":type==="usaha"?"🏪":"👤"} Akun ${accountLabel(type)}</div><h2>${esc(user.displayName||user.name)}</h2><p class="muted">@${esc(user.username)}</p>${extra}<div class="stats"><div><b>${mine.length}</b><span>POSTS</span></div><div><b>0</b><span>FOLLOWERS</span></div><div><b>0</b><span>FOLLOWING</span></div></div><button class="btn" onclick="editProfile()">EDIT PROFILE</button></div><div class="card"><div class="profileTabs"><button class="profileTab ${tab==="posts"?"active":""}" onclick="renderMe('posts')">📝 POSTS</button><button class="profileTab ${tab==="photos"?"active":""}" onclick="renderMe('photos')">📷 PHOTOS</button></div>${tab==="posts"?(mine.length?mine.map(p=>`<div class="profilePost" onclick='openDetail(${JSON.stringify(p)})'><h3>${esc(p.t)}</h3><p>📍 ${esc(p.place||"Canggu Beach")} • ${ago(p.time)} • 🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</p>${p.photo?`<img class="postPhotoLarge" src="${esc(p.photo)}">`:""}</div>`).join(""):`<div class="empty">Belum ada postingan.<br>Tekan + untuk posting.</div>`):(mine.filter(p=>p.photo).length?`<div class="profileGrid">${mine.filter(p=>p.photo).map(p=>`<div class="photoTile" onclick='openDetail(${JSON.stringify(p)})'><img src="${esc(p.photo)}"><div class="photoMeta">🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</div></div>`).join("")}</div>`:`<div class="empty">Belum ada foto.</div>`)}</div><button class="btn danger" onclick="logout()">LOG OUT</button></div>`}
function openDetail(p){activePost={...p,likes:p.likes||0,comments:p.comments||[]};detailModal.classList.remove("hidden");renderDetail()}
function closeDetail(){detailModal.classList.add("hidden");activePost=null}
function renderDetail(){if(!activePost)return;detailBox.innerHTML=`<div class="muted">📍 ${esc(activePost.place||"Canggu Beach")} • ${ago(activePost.time)}</div><h2>${esc(activePost.u||"You")}</h2><div style="font-size:17px;line-height:1.45">${esc(activePost.t||"")}</div>${activePost.photo?`<img class="postPhotoLarge" src="${esc(activePost.photo)}">`:""}<div class="actions"><button class="action ${activePost._liked?"liked":""}" onclick="toggleLike()">🔥 ${activePost.likes||0} NOW</button><button class="action" onclick="document.getElementById('commentInput').focus()">💬 ${(activePost.comments||[]).length}</button><button class="action" onclick="sharePost()">↗️ Bagikan</button></div><div style="display:flex;gap:8px"><input id="commentInput" placeholder="Tulis komentar..." style="margin:0"><button class="btn small" onclick="addComment()">KIRIM</button></div><h3>Komentar</h3>${activePost.comments?.length?activePost.comments.map(c=>`<div class="comment"><b>${esc(c.u)}</b><div class="muted">${esc(c.t)}</div></div>`).join(""):`<div class="empty">Belum ada komentar.</div>`}`}
function toggleLike(){if(!activePost)return;activePost._liked=!activePost._liked;activePost.likes=Math.max(0,(activePost.likes||0)+(activePost._liked?1:-1));const i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].likes=activePost.likes;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function addComment(){const t=val("commentInput");if(!t)return;activePost.comments.push({u:user?.name||"You",t});const i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].comments=activePost.comments;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function sharePost(){const text=`${activePost?.t||""} — NOW BALI`;if(navigator.share)navigator.share({title:"NOW BALI",text}).catch(()=>{});else alert("Posting siap dibagikan.")}
function openAuth(){authModal.classList.remove("hidden");renderAuth("login")}function closeAuth(){authModal.classList.add("hidden")}
function renderAuth(mode="login",type="personal"){if(mode==="login"){authBox.innerHTML=`<h2>Login ke NOW</h2><div class="notice">Gunakan email yang sudah diverifikasi.</div><input id="authEmail" type="email" placeholder="Email"><input id="authPass" type="password" placeholder="Password"><button class="btn" onclick="doAuth('login')">LOGIN</button><p class="muted" style="text-align:center;margin-top:16px">Belum punya akun? <button class="guestLogin" onclick="renderAuth('register')">Register</button></p>`;return}const detail=type==="driver"?`<div class="formSection"><h3>🚗 Data Driver</h3><input id="driverCar" placeholder="Jenis Mobil"><input id="driverVehicle" placeholder="Nomor Kendaraan"><input id="driverPhone" type="tel" placeholder="Nomor WhatsApp"></div>`:type==="usaha"?`<div class="formSection"><h3>🏪 Data UMKM / Usaha</h3><input id="businessName" placeholder="Nama Usaha"><input id="businessType" placeholder="Jenis Usaha"><input id="businessAddress" placeholder="Alamat Usaha"><input id="businessPhone" type="tel" placeholder="Nomor WhatsApp"></div>`:`<div class="formSection"><h3>👤 Data Personal / Customer</h3><input id="personalPhone" type="tel" placeholder="Nomor WhatsApp"></div>`;authBox.innerHTML=`<h2>Buat akun NOW</h2><div class="notice">Semua akun gratis. Pilih jenis akun.</div><div class="accountChoices"><button class="accountChoice ${type==="personal"?"active":""}" onclick="renderAuth('register','personal')"><span>👤</span>Personal</button><button class="accountChoice ${type==="driver"?"active":""}" onclick="renderAuth('register','driver')"><span>🚗</span>Driver</button><button class="accountChoice ${type==="usaha"?"active":""}" onclick="renderAuth('register','usaha')"><span>🏪</span>UMKM / Usaha</button></div><input id="authName" placeholder="Nama"><input id="authUser" placeholder="Username (unik)"><input id="authEmail" type="email" placeholder="Email"><input id="authPass" type="password" placeholder="Password (min. 6 karakter)">${detail}<button class="btn" onclick="doAuth('register','${type}')">REGISTER</button><p class="muted" style="text-align:center;margin-top:16px">Sudah punya akun? <button class="guestLogin" onclick="renderAuth('login')">Login</button></p>`}
function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve("");const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function doAuth(mode,type="personal"){try{if(mode==="login"){const email=val("authEmail").toLowerCase(),pass=document.getElementById("authPass")?.value||"";if(!emailOK(email))return alert("Email salah atau tidak valid.");const {data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return alert(error.message);user=await syncAccount(data.session);if(!user)return alert("Profil belum tersedia. Coba lagi.");localStorage.setItem("now_user",JSON.stringify(user));closeAuth();show("me");return}const name=val("authName"),username=val("authUser"),email=val("authEmail").toLowerCase(),password=document.getElementById("authPass")?.value||"";if(!name)return alert("Isi Nama dulu.");if(!userOK(username))return alert("Username 3–30 karakter, hanya huruf, angka dan underscore.");if(!emailOK(email))return alert("Email salah atau tidak valid.");if(password.length<6)return alert("Password minimal 6 karakter.");let phone=type==="driver"?val("driverPhone"):type==="usaha"?val("businessPhone"):val("personalPhone");phone=phone.replace(/[\s().-]/g,"");if(!phoneOK(phone))return alert("Nomor WhatsApp tidak valid. Contoh: +628123456789");const {data:dup}=await sb.from("profiles").select("id").ilike("username",username).limit(1);if(dup?.length)return alert("Username sudah digunakan.");let meta={name,username,account_type:type,phone};if(type==="driver"){const car=val("driverCar"),vehicle=val("driverVehicle");if(!car||!vehicle)return alert("Lengkapi data Driver.");meta.vehicle_type=car;meta.vehicle_plate=vehicle}else if(type==="usaha"){const bn=val("businessName"),bt=val("businessType"),ad=val("businessAddress");if(!bn||!bt||!ad)return alert("Lengkapi data UMKM / Usaha.");meta.business_name=bn;meta.business_type=bt;meta.business_address=ad}const {data,error}=await sb.auth.signUp({email,password,options:{data:meta,emailRedirectTo:location.origin}});if(error){if(/invalid.*email|email.*valid/i.test(error.message))return alert("Email salah atau tidak valid.");return alert(error.message)}if(!data.session){alert("Registrasi berhasil. Silakan konfirmasi email melalui link yang dikirim ke email kamu.");renderAuth("login")}else{user=await syncAccount(data.session);localStorage.setItem("now_user",JSON.stringify(user));closeAuth();show("me")}}catch(e){console.error(e);alert("Terjadi kesalahan. Silakan coba lagi.")}}
function editProfile(){profileModal.classList.remove("hidden");profileBox.innerHTML=`<h2>Edit Profile</h2><input id="editName" value="${esc(user.name)}"><input id="editUser" value="${esc(user.username)}"><button class="btn" onclick="saveProfile()">SAVE</button>`}
async function saveProfile(){const name=val("editName")||user.name,username=val("editUser")||user.username;const {error}=await sb.from("profiles").update({name,username}).eq("id",user.id);if(error)return alert(error.message);user.name=name;user.username=username;localStorage.setItem("now_user",JSON.stringify(user));profileModal.classList.add("hidden");show("me")}
function openPost(place="Canggu Beach"){postModal.classList.remove("hidden");document.getElementById("postPlace").value=place}function closePost(){postModal.classList.add("hidden")}
document.getElementById("postPhoto").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoPreview.src=r.result;photoPreview.classList.remove("hidden")};r.readAsDataURL(f)}
function publishPost(){const t=val("postText"),place=val("postPlace")||"Canggu Beach",f=document.getElementById("postPhoto").files[0];if(!t)return alert("Tulis dulu apa yang sedang terjadi.");readImage(f).then(photo=>{posts.unshift({id:"p"+Date.now(),t,u:user?.name||"You",place,time:Date.now(),photo,likes:0,comments:[]});localStorage.setItem("now_posts_v2",JSON.stringify(posts));document.getElementById("postText").value="";document.getElementById("postPhoto").value="";photoPreview.classList.add("hidden");closePost();show("now");alert("🔥 NOW berhasil diposting!")})}
function logout(){sb.auth.signOut();user=null;localStorage.removeItem("now_user");closePost();closeDetail();closeAuth();show("now")}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));document.getElementById("plus").onclick=()=>user?openPost("Canggu Beach"):renderGuest();
(async()=>{const {data}=await sb.auth.getSession();if(data.session){user=await syncAccount(data.session);localStorage.setItem("now_user",JSON.stringify(user));show("now")}else{renderGuest()}})();
</script>
</body>
</html>
