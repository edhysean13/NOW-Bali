<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NOW BALI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
#app{max-width:430px;min-height:100vh;margin:auto;background:#090b12;padding-bottom:82px}
header{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #282d39;position:sticky;top:0;background:#090b12ee;backdrop-filter:blur(15px);z-index:5}.logo{font-size:27px;font-weight:900}.logo span{color:#ff7438}.live{font-size:10px;color:#55e39a;border:1px solid #28704e;border-radius:20px;padding:6px 9px}
.page{padding:15px}.title{display:flex;justify-content:space-between;align-items:center}.title h2,h2{font-size:16px;margin:10px 0}.muted{color:#8d95a8;font-size:11px}.card{background:#12151e;border:1px solid #282d39;border-radius:18px;margin:12px 0;overflow:hidden}
.hero{height:190px;background:linear-gradient(#0000,#000d),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80") center/cover;position:relative}.heroText{position:absolute;left:14px;bottom:14px}.badge{background:linear-gradient(90deg,#ff3fa4,#ff7438);padding:6px 10px;border-radius:99px;font-size:10px;font-weight:800}.hero h1{margin:8px 0 3px}
.row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #242935;align-items:center;cursor:pointer}.row:last-child{border:0}.row h3{margin:0 0 4px;font-size:14px}.row p{margin:0}.score{font-size:21px;font-weight:900;color:#ff7846;min-width:42px;text-align:center}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#202531}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#ff3fa4,#ff7438);color:#fff;font-weight:800}.btn.secondary{background:#222733}.btn.danger{background:#5a2028}.btn.small{width:auto;padding:9px 12px;font-size:11px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:74px;background:#0d1018f7;border-top:1px solid #282d39;display:flex;justify-content:space-around;align-items:center;z-index:8}nav button{border:0;background:none;color:#747d91;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.active{color:#ff4da7}nav small{font-size:9px}#plus{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ff3fa4,#ff7438);color:#fff;font-size:27px;border:3px solid #090b12;margin-top:-18px}
.overlay{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end}.hidden{display:none!important}.sheet{width:min(430px,100%);background:#12151e;border-radius:25px 25px 0 0;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;background:none;color:#aaa;font-size:27px}
input,textarea{width:100%;background:#090c13;color:#fff;border:1px solid #303543;border-radius:13px;padding:12px;margin:7px 0;outline:none}textarea{height:110px;resize:none}.postPhotoLarge,.photoPreview{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-top:10px}.notice{padding:11px;border-radius:12px;background:#171c27;color:#aeb5c4;font-size:11px;margin:10px 0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#202632;color:#cdd2dd;font-size:10px;margin:2px}.empty{text-align:center;padding:30px 15px;color:#8991a4;font-size:12px}
.profileHead{text-align:center;padding:22px}.avatar{width:88px;height:88px;border-radius:50%;background:#222733;border:2px solid #ff5a9f;display:grid;place-items:center;margin:auto;font-size:28px;object-fit:cover}.avatar.small{width:52px;height:52px;font-size:18px}.avatarWrap{width:108px;height:108px;margin:auto;position:relative;display:grid;place-items:center}.avatarWrap .avatar{width:88px;height:88px}.accountBadge{position:absolute;right:0;bottom:2px;width:38px;height:38px;border-radius:50%;background:#1a202b;border:3px solid #ff5b8f;display:grid;place-items:center;font-size:22px}.accountLabel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 11px;border-radius:99px;background:#202632;border:1px solid #343b4b;font-size:11px;font-weight:800}.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}.stats b{display:block;font-size:18px}.stats span{font-size:10px;color:#8991a4}.driverInfo{margin-top:16px;text-align:left;background:#0d1119;border:1px solid #2b3240;border-radius:16px;padding:14px}.driverItem{padding:9px 0;border-bottom:1px solid #242a35}.driverItem:last-child{border:0}.driverItem b{display:block;font-size:12px}.driverItem span{display:block;color:#8d95a8;font-size:10px;margin-top:2px}.waBtn{display:inline-block;background:#183d2a;color:#69e7a0;border:1px solid #286545;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800;text-decoration:none}.profileTabs{display:flex;border-bottom:1px solid #2a3040;margin:12px 0}.profileTab{flex:1;padding:13px 6px;background:none;border:0;color:#8991a4;font-weight:800}.profileTab.active{color:#ff5a9f;border-bottom:2px solid #ff5a9f}.profilePost{padding:14px;border-bottom:1px solid #252b36;cursor:pointer}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.profileGrid img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}.photoTile{position:relative;cursor:pointer}.photoMeta{position:absolute;left:5px;bottom:5px;background:#090b12dd;border-radius:10px;padding:4px 7px;font-size:10px}.actions{display:flex;gap:8px;margin:12px 0}.action{flex:1;border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:12px;padding:10px}.action.liked{color:#ff7043;border-color:#ff7043}.comment{padding:10px 0;border-bottom:1px solid #252b36}
.filterRow{display:flex;gap:8px;overflow:auto;margin:8px 0}.filter{border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:99px;padding:8px 12px;font-size:11px;white-space:nowrap}.filter.active{border-color:#ff5a9f;color:#ff7ab5}.personCard{padding:14px;border-bottom:1px solid #252b36}.personTop{display:flex;gap:12px;align-items:center}.personMeta{flex:1}.personMeta h3{margin:0 0 3px;font-size:14px}.personActions{display:flex;gap:8px;margin-top:10px}
.packageCard{padding:14px;border-bottom:1px solid #252b36}.packageCard h3{margin:0 0 6px;font-size:15px}.packagePrice{font-size:18px;font-weight:900;color:#ff7a45}.packageMeta{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}.packageMeta span{font-size:10px;background:#202632;padding:5px 8px;border-radius:99px;color:#cdd2dd}.packageText{font-size:11px;color:#aeb5c4;line-height:1.5;white-space:pre-line;margin-top:8px}.packagePhoto{width:100%;max-height:220px;object-fit:cover;border-radius:13px;margin:8px 0}
.guestPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}.guestCard{width:100%;background:#12151e;border:1px solid #282d39;border-radius:26px;padding:34px 22px;text-align:center}.guestLogo{font-size:46px;font-weight:950}.guestLogo span{color:#ff7438}.guestTitle{font-size:23px;font-weight:900;margin:20px 0 8px}.guestText{color:#8d95a8;font-size:12px;line-height:1.5;margin-bottom:22px}.guestLogin{border:0;background:none;color:#ff6a9e;font-weight:800;padding:12px}.accountChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.accountChoice{border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:14px;padding:14px 8px;text-align:center;font-weight:800}.accountChoice.active{border-color:#ff5a9f;background:#2b1b2a}.accountChoice span{display:block;font-size:24px;margin-bottom:5px}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">NOW <span>BALI</span></div><div class="live">● LIVE</div></header>
<main id="main"></main>
<nav><button data-tab="now">🔥<small>NOW</small></button><button data-tab="near">📍<small>NEAR</small></button><button id="plus">+</button><button data-tab="people">👥<small>PEOPLE</small></button><button data-tab="me">◉<small>ME</small></button></nav>
<div id="authModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeAuth()">×</button><div id="authBox"></div></div></div>
<div id="postModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closePost()">×</button><h2>Post NOW</h2><textarea id="postText" placeholder="Apa yang sedang terjadi sekarang?"></textarea><input id="postPlace" placeholder="Lokasi / tempat" value="Canggu Beach"><input id="postPhoto" type="file" accept="image/*"><img id="photoPreview" class="postPhotoLarge hidden"><button class="btn" onclick="publishPost()">POST NOW</button></div></div>
<div id="detailModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeDetail()">×</button><div id="detailBox"></div></div></div>
<div id="packageModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closePackage()">×</button><div id="packageBox"></div></div></div>
<div id="profileModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeProfile()">×</button><div id="profileBox"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://wjeyyklbcrqxawoxlphk.supabase.co","sb_publishable_d26AD3NNlXOW3oVuJOgVNg_6vNoSb-E");
const $=id=>document.getElementById(id), main=$("main"); let user=null,activePost=null,searchType="all";
let posts=JSON.parse(localStorage.getItem("now_posts_v2")||"[]").map((p,i)=>({...p,id:p.id||"old"+i,likes:p.likes||0,comments:p.comments||[]}));
const places=[{name:"Canggu Beach",score:94,people:126,posts:38,distance:"2.4 km",emoji:"🔥"},{name:"Seminyak",score:88,people:74,posts:22,distance:"4.1 km",emoji:"🎵"},{name:"Kuta Beach",score:81,people:61,posts:17,distance:"7.2 km",emoji:"🌅"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),val=id=>$(id)?.value.trim()||"",emailOK=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),userOK=v=>/^[A-Za-z0-9_]{3,30}$/.test(v),phoneOK=v=>/^\+?[1-9]\d{7,14}$/.test(String(v).replace(/[\s().-]/g,"")),ago=t=>{let m=Math.floor((Date.now()-t)/60000);return m<1?"baru saja":m+" min lalu"};
function avatar(u,small=false){return u?.photo?`<img class="avatar ${small?"small":""}" src="${esc(u.photo)}">`:`<div class="avatar ${small?"small":""}">${esc((u?.name||"U")[0].toUpperCase())}</div>`}
async function loadProfile(session){if(!session?.user)return null;let {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(!p)return null;let u={id:p.id,name:p.name,displayName:p.name,username:p.username,phone:p.phone,accountType:p.account_type,photo:p.avatar_url||""};if(p.account_type==="driver"){let {data:d}=await sb.from("driver_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(d)u.driver={carType:d.vehicle_type,vehicleNumber:d.vehicle_plate}}if(p.account_type==="usaha"){let {data:b}=await sb.from("business_profiles").select("*").eq("profile_id",p.id).maybeSingle();if(b)u.business={name:b.business_name,type:b.business_type,address:b.address,phone:p.phone};u.displayName=u.business?.name||u.displayName}return u}
async function sync(session){let a=session.user.user_metadata||{},id=session.user.id,type=a.account_type||"personal",name=a.name||session.user.email?.split("@")[0]||"User",username=a.username||name.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30),phone=a.phone||"";await sb.from("profiles").upsert({id,name,username,phone,account_type:type},{onConflict:"id"});if(type==="driver")await sb.from("driver_profiles").upsert({profile_id:id,vehicle_type:a.vehicle_type||"",vehicle_plate:a.vehicle_plate||""},{onConflict:"profile_id"});if(type==="usaha")await sb.from("business_profiles").upsert({profile_id:id,business_name:a.business_name||"",business_type:a.business_type||"",address:a.business_address||""},{onConflict:"profile_id"});return loadProfile(session)}
function guest(){document.querySelector("nav").style.display="none";main.innerHTML=`<div class="guestPage"><div class="guestCard"><div class="guestLogo">NOW <span>BALI</span></div><div class="guestTitle">Selamat datang di NOW Bali</div><div class="guestText">Buat akun untuk mengakses Feed, Near, People, Profile, postingan, komentar dan fitur NOW Bali.</div><button class="btn" onclick="openAuth();renderAuth('register','personal')">REGISTER</button><button class="guestLogin" onclick="openAuth();renderAuth('login')">Sudah punya akun? Login</button></div></div>`}
function show(tab="now"){if(!user)return guest();document.querySelector("nav").style.display="flex";document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({now:renderNow,near:renderNear,people:renderPeople,me:renderMe}[tab]||renderNow)()}
function postRow(p){return `<div class="row" onclick='openDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'>${p.photo?`<img class="thumb" src="${esc(p.photo)}">`:``}<div style="flex:1"><h3>${esc(p.t)}</h3><p class="muted">${esc(p.u)} • ${ago(p.time)} • 📍 ${esc(p.place||"Canggu Beach")}</p><span class="tag">🔥 ${p.likes||0}</span><span class="tag">💬 ${(p.comments||[]).length}</span></div></div>`}
function renderNow(){let p=places[0],demo=[{id:"demo1",t:"Sunset gila hari ini! 🌅",u:"Made Dharma",time:Date.now()-120000,likes:12,comments:[{u:"Sari",t:"Bagus banget!"}],photo:""},{id:"demo2",t:"Ramai banget malam ini 🔥",u:"Sara Kim",time:Date.now()-300000,likes:8,comments:[],photo:""}];main.innerHTML=`<div class="page"><div class="title"><h2>🔥 Happening Now</h2><span class="muted">LIVE</span></div><div class="card"><div class="hero"><div class="heroText"><span class="badge">NOW SCORE ${p.score}</span><h1>${p.emoji} ${p.name}</h1><span class="muted">${p.people} people • ${p.posts} posts • sangat ramai sekarang</span></div></div></div><div class="title"><h2>⚡ Live Feed</h2></div><div class="card">${[...demo,...posts].slice(0,12).map(postRow).join("")||`<div class="empty">Belum ada postingan.</div>`}</div><div class="title"><h2>🔥 Top Places</h2></div><div class="card">${places.map(x=>`<div class="row" onclick="placeDetail('${x.name}')"><span class="score">${x.score}</span><div><h3>${x.emoji} ${x.name}</h3><p class="muted">${x.people} people active • ${x.posts} posts • ${x.distance}</p></div></div>`).join("")}</div></div>`}
function renderNear(){main.innerHTML=`<div class="page"><h2>📍 Near You</h2><div class="notice">GPS akan kita sambungkan pada tahap berikutnya.</div><div class="card">${places.map(x=>`<div class="row" onclick="placeDetail('${x.name}')"><span class="score">${x.score}</span><div><h3>${x.emoji} ${x.name}</h3><p class="muted">${x.distance} • ${x.people} people active</p></div></div>`).join("")}</div></div>`}
function placeDetail(n){let p=places.find(x=>x.name===n)||places[0];main.innerHTML=`<div class="page"><button class="guestLogin" onclick="show('near')">← Kembali</button><h2>${p.emoji} ${p.name}</h2><div class="card">${posts.filter(x=>(x.place||"Canggu Beach")===p.name).map(postRow).join("")||`<div class="empty">Belum ada postingan di sini.</div>`}<div class="row"><button class="btn" onclick="openPost('${p.name}')">➕ Post di sini</button></div></div></div>`}
function renderPeople(){if(user.accountType!=="personal"){main.innerHTML=`<div class="page"><h2>👥 People</h2><div class="notice">Pencarian Driver dan UMKM / Usaha tersedia untuk akun Personal / Customer.</div></div>`;return}main.innerHTML=`<div class="page"><h2>👥 Cari Driver / UMKM</h2><div class="notice">Cari penyedia liburan Bali dan hubungi mereka langsung.</div><input id="peopleSearch" placeholder="Cari nama, username, usaha, jenis usaha..." oninput="searchPeople()"><div class="filterRow"><button id="f-all" class="filter active" onclick="setType('all')">Semua</button><button id="f-driver" class="filter" onclick="setType('driver')">🚗 Driver</button><button id="f-usaha" class="filter" onclick="setType('usaha')">🏪 UMKM / Usaha</button></div><div id="peopleResults" class="card"><div class="empty">Ketik nama atau pilih kategori.</div></div></div>`}
function setType(t){searchType=t;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));$("f-"+t).classList.add("active");searchPeople()}
async function searchPeople(){let q=val("peopleSearch").toLowerCase(),types=searchType==="all"?["driver","usaha"]:[searchType],r=await sb.from("profiles").select("id,name,username,phone,account_type,avatar_url").in("account_type",types).limit(50);if(r.error)return $("peopleResults").innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;let out=[];for(let p of r.data||[]){let d=null,b=null;if(p.account_type==="driver"){let x=await sb.from("driver_profiles").select("vehicle_type,vehicle_plate").eq("profile_id",p.id).maybeSingle();d=x.data}else{let x=await sb.from("business_profiles").select("business_name,business_type,address").eq("profile_id",p.id).maybeSingle();b=x.data}let hay=`${p.name} ${p.username} ${d?.vehicle_type||""} ${b?.business_name||""} ${b?.business_type||""}`.toLowerCase();if(q&&!hay.includes(q))continue;out.push({...p,d,b})}$("peopleResults").innerHTML=out.length?out.map(personCard).join(""):`<div class="empty">Tidak ditemukan.</div>`}
function personCard(p){let driver=p.account_type==="driver",name=driver?p.name:(p.b?.business_name||p.name),sub=driver?`${p.d?.vehicle_type||"Driver"} • ${p.d?.vehicle_plate||"-"}`:`${p.b?.business_type||"UMKM / Usaha"} • ${p.b?.address||"-"}`,phone=p.phone||"";return `<div class="personCard"><div class="personTop">${avatar({name},true)}<div class="personMeta"><h3>${esc(name)}</h3><p class="muted">@${esc(p.username||"")} • ${driver?"🚗 Driver":"🏪 UMKM / Usaha"}</p><p class="muted">${esc(sub)}</p></div></div><div class="personActions">${phone?`<a class="waBtn" href="https://wa.me/${phone.replace(/\D/g,"")}" target="_blank">WhatsApp</a>`:""}<button class="btn secondary small" onclick='viewPerson(${JSON.stringify(p).replace(/'/g,"&#39;")})'>LIHAT PROFIL</button></div></div>`}
function viewPerson(p){let driver=p.account_type==="driver",name=driver?p.name:(p.b?.business_name||p.name),txt=driver?`Driver: ${name}\nMobil: ${p.d?.vehicle_type||"-"}\nKendaraan: ${p.d?.vehicle_plate||"-"}`:`Usaha: ${name}\nJenis: ${p.b?.business_type||"-"}\nAlamat: ${p.b?.address||"-"}`;alert(txt)}
function renderMe(tab="posts"){let mine=posts.filter(p=>p.u===user.name).sort((a,b)=>b.time-a.time),type=user.accountType||"personal",icon=type==="driver"?"🚗":type==="usaha"?"🏪":"👤",label=type==="driver"?"Driver":type==="usaha"?"UMKM / Usaha":"Personal / Customer",extra=type==="driver"&&user.driver?`<div class="driverInfo"><b>🚗 Informasi Driver</b><div class="driverItem"><b>${esc(user.driver.carType)}</b><span>Jenis mobil</span></div><div class="driverItem"><b>${esc(user.driver.vehicleNumber)}</b><span>Nomor kendaraan</span></div><div class="driverItem"><b>${esc(user.phone)}</b><span>WhatsApp untuk order</span></div></div>`:type==="usaha"&&user.business?`<div class="driverInfo"><b>🏪 Informasi UMKM / Usaha</b><div class="driverItem"><b>${esc(user.business.name)}</b><span>Nama usaha</span></div><div class="driverItem"><b>${esc(user.business.type)}</b><span>Jenis usaha</span></div><div class="driverItem"><b>${esc(user.business.address)}</b><span>Alamat</span></div></div>`:"";main.innerHTML=`<div class="page"><h2>👤 ME</h2><div class="card profileHead"><div class="avatarWrap">${avatar(user)}<div class="accountBadge">${icon}</div></div><div class="accountLabel">${icon} Akun ${label}</div><h2>${esc(user.displayName||user.name)}</h2><p class="muted">@${esc(user.username)}</p>${extra}<div class="stats"><div><b>${mine.length}</b><span>POSTS</span></div><div><b>0</b><span>FOLLOWERS</span></div><div><b>0</b><span>FOLLOWING</span></div></div><button class="btn" onclick="editProfile()">EDIT PROFILE</button>${type==="driver"?`<button class="btn secondary" style="margin-top:8px" onclick="openPackage()">➕ ADD PAKET LIBURAN</button>`:""}</div>${type==="driver"?`<div class="card"><div class="title" style="padding:12px"><h3>🎒 PAKET LIBURAN SAYA</h3><button class="btn small" onclick="openPackage()">+ Paket</button></div><div id="myPackages"><div class="empty">Memuat...</div></div></div>`:""}<div class="card"><div class="profileTabs"><button class="profileTab ${tab==="posts"?"active":""}" onclick="renderMe('posts')">📝 POSTS</button><button class="profileTab ${tab==="photos"?"active":""}" onclick="renderMe('photos')">📷 PHOTOS</button></div>${tab==="posts"?(mine.length?mine.map(postRow).join(""):`<div class="empty">Belum ada postingan.</div>`):(mine.filter(p=>p.photo).length?`<div class="profileGrid">${mine.filter(p=>p.photo).map(p=>`<div class="photoTile" onclick='openDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'><img src="${esc(p.photo)}"><div class="photoMeta">🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</div></div>`).join("")}</div>`:`<div class="empty">Belum ada foto.</div>`)}</div><button class="btn danger" onclick="logout()">LOG OUT</button></div>`;if(type==="driver")loadPackages()}
async function loadPackages(){let box=$("myPackages");if(!box)return;let r=await sb.from("travel_packages").select("*").eq("owner_id",user.id).order("created_at",{ascending:false});if(r.error)return box.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;box.innerHTML=(r.data||[]).length?r.data.map(p=>packageCard(p,true)).join(""):`<div class="empty">Belum ada paket.</div>`}
function packageCard(p,owner){return `<div class="packageCard">${p.photo_url?`<img class="packagePhoto" src="${esc(p.photo_url)}">`:""}<h3>🎒 ${esc(p.title)}</h3><div class="packagePrice">Rp ${Number(p.price||0).toLocaleString("id-ID")}</div><div class="packageMeta"><span>⏱️ ${esc(p.duration_hours)} jam</span></div>${p.description?`<div class="packageText">${esc(p.description)}</div>`:""}${p.itinerary?`<div class="packageText"><b>📍 Itinerary</b>\n${esc(p.itinerary)}</div>`:""}${p.hotel?`<div class="packageText"><b>🏨 Hotel</b> — ${esc(p.hotel)}</div>`:""}${p.restaurant?`<div class="packageText"><b>🍽️ Restoran</b> — ${esc(p.restaurant)}</div>`:""}<div class="packageActions">${owner?`<button class="btn danger small" onclick="deletePackage('${p.id}')">Hapus</button>`:`<button class="btn small" onclick='contactPackage(${JSON.stringify(p).replace(/'/g,"&#39;")})'>💬 Hubungi Driver</button>`}</div></div>`}
function openPackage(){if(user.accountType!=="driver")return alert("Fitur ini hanya untuk akun Driver.");$("packageModal").classList.remove("hidden");$("packageBox").innerHTML=`<h2>➕ Add Paket Liburan</h2><div class="notice">Tidak ada pembayaran di NOW BALI. Customer menghubungi Driver langsung.</div><input id="pkgTitle" placeholder="Nama Paket"><input id="pkgPrice" type="number" placeholder="Harga (Rp)"><input id="pkgHours" type="number" step=".5" placeholder="Durasi (jam)"><textarea id="pkgDesc" placeholder="Keterangan"></textarea><textarea id="pkgItinerary" placeholder="Itinerary — Tempat A\nTempat B\nTempat C"></textarea><input id="pkgHotel" placeholder="Hotel (opsional)"><input id="pkgRestaurant" placeholder="Restoran (opsional)"><input id="pkgPhoto" type="url" placeholder="Link foto (opsional)"><button class="btn" onclick="savePackage()">TERBITKAN PAKET</button>`}
function closePackage(){$("packageModal").classList.add("hidden")}
async function savePackage(){let title=val("pkgTitle"),price=+val("pkgPrice"),hours=+val("pkgHours"),description=val("pkgDesc"),itinerary=val("pkgItinerary"),hotel=val("pkgHotel"),restaurant=val("pkgRestaurant"),photo=val("pkgPhoto");if(!title||price<=0||hours<=0)return alert("Nama paket, harga dan durasi wajib diisi.");let r=await sb.from("travel_packages").insert({owner_id:user.id,title,price,duration_hours:hours,description,itinerary,hotel,restaurant,photo_url:photo,is_published:true});if(r.error)return alert("Paket gagal dibuat: "+r.error.message);closePackage();renderMe();alert("Paket berhasil diterbitkan.")}
async function deletePackage(id){if(!confirm("Hapus paket ini?"))return;let r=await sb.from("travel_packages").delete().eq("id",id);if(r.error)alert(r.error.message);else loadPackages()}
function contactPackage(p){if(!user?.phone)return alert("Nomor Driver belum tersedia.");let text=`Halo, saya tertarik dengan paket ${p.title}. Saya ingin tanya tanggal dan detailnya.`;window.open(`https://wa.me/${user.phone.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`,"_blank")}
function openDetail(p){activePost={...p,likes:p.likes||0,comments:p.comments||[],liked:false};$("detailModal").classList.remove("hidden");renderDetail()}
function closeDetail(){$("detailModal").classList.add("hidden");activePost=null}
function renderDetail(){let p=activePost;$("detailBox").innerHTML=`<p class="muted">📍 ${esc(p.place||"Canggu Beach")} • ${ago(p.time)}</p><h2>${esc(p.u||"You")}</h2><div style="font-size:17px;line-height:1.45">${esc(p.t||"")}</div>${p.photo?`<img class="postPhotoLarge" src="${esc(p.photo)}">`:""}<div class="actions"><button class="action ${p.liked?"liked":""}" onclick="likePost()">🔥 ${p.likes||0}</button><button class="action" onclick="$('commentInput').focus()">💬 ${(p.comments||[]).length}</button><button class="action" onclick="sharePost()">↗️ Bagikan</button></div><div style="display:flex;gap:8px"><input id="commentInput" placeholder="Tulis komentar..." style="margin:0"><button class="btn small" onclick="addComment()">KIRIM</button></div><h3>Komentar</h3>${p.comments?.length?p.comments.map(c=>`<div class="comment"><b>${esc(c.u)}</b><div class="muted">${esc(c.t)}</div></div>`).join(""):`<div class="empty">Belum ada komentar.</div>`}`}
function likePost(){activePost.liked=!activePost.liked;activePost.likes=Math.max(0,(activePost.likes||0)+(activePost.liked?1:-1));let i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].likes=activePost.likes;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function addComment(){let t=val("commentInput");if(!t)return;activePost.comments.push({u:user.name,t});let i=posts.findIndex(x=>x.id===activePost.id);if(i>=0){posts[i].comments=activePost.comments;localStorage.setItem("now_posts_v2",JSON.stringify(posts))}renderDetail()}
function sharePost(){if(navigator.share)navigator.share({title:"NOW BALI",text:`${activePost.t} — NOW BALI`}).catch(()=>{});else alert("Posting siap dibagikan.")}
function openPost(place="Canggu Beach"){$("postModal").classList.remove("hidden");$("postPlace").value=place}function closePost(){$("postModal").classList.add("hidden")}
$("postPhoto").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$("photoPreview").src=r.result;$("photoPreview").classList.remove("hidden")};r.readAsDataURL(f)}
function publishPost(){let t=val("postText"),place=val("postPlace")||"Canggu Beach",f=$("postPhoto").files[0];if(!t)return alert("Tulis dulu apa yang sedang terjadi.");let done=photo=>{posts.unshift({id:"p"+Date.now(),t,u:user.name,place,time:Date.now(),photo,likes:0,comments:[]});localStorage.setItem("now_posts_v2",JSON.stringify(posts));$("postText").value="";$("postPhoto").value="";$("photoPreview").classList.add("hidden");closePost();show("now")};if(f){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function openAuth(){ $("authModal").classList.remove("hidden")}function closeAuth(){$("authModal").classList.add("hidden")}
function renderAuth(mode="login",type="personal"){if(mode==="login"){authBox.innerHTML=`<h2>Login ke NOW</h2><div class="notice">Gunakan email yang sudah diverifikasi.</div><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">LOGIN</button><p class="muted" style="text-align:center">Belum punya akun? <button class="guestLogin" onclick="renderAuth('register','personal')">Register</button></p>`;return}let extra=type==="driver"?`<input id="car" placeholder="Jenis Mobil"><input id="plate" placeholder="Nomor Kendaraan"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:type==="usaha"?`<input id="bn" placeholder="Nama Usaha"><input id="bt" placeholder="Jenis Usaha"><input id="ba" placeholder="Alamat Usaha"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:`<input id="phone" type="tel" placeholder="Nomor WhatsApp">`;authBox.innerHTML=`<h2>Buat akun NOW</h2><div class="notice">Semua akun gratis.</div><div class="accountChoices"><button class="accountChoice ${type==="personal"?"active":""}" onclick="renderAuth('register','personal')"><span>👤</span>Personal</button><button class="accountChoice ${type==="driver"?"active":""}" onclick="renderAuth('register','driver')"><span>🚗</span>Driver</button><button class="accountChoice ${type==="usaha"?"active":""}" onclick="renderAuth('register','usaha')"><span>🏪</span>UMKM</button></div><input id="regName" placeholder="Nama"><input id="regUsername" placeholder="Username (unik)"><input id="regEmail" type="email" placeholder="Email">${extra}<input id="regPassword" type="password" placeholder="Password (min. 6 karakter)"><button class="btn" onclick="doRegister('${type}')">REGISTER</button><p class="muted" style="text-align:center">Sudah punya akun? <button class="guestLogin" onclick="renderAuth('login')">Login</button></p>`}
async function doLogin(){let email=val("loginEmail").toLowerCase(),password=$("loginPassword").value;if(!emailOK(email))return alert("Email salah atau tidak valid.");let r=await sb.auth.signInWithPassword({email,password});if(r.error)return alert(r.error.message);user=await sync(r.data.session);if(!user)return alert("Profil belum tersedia.");closeAuth();show("now")}
async function doRegister(type){let name=val("regName"),un=val("regUsername"),email=val("regEmail").toLowerCase(),pw=$("regPassword").value;if(!name)return alert("Isi Nama dulu.");if(!userOK(un))return alert("Username 3–30 karakter, hanya huruf, angka dan underscore.");if(!emailOK(email))return alert("Email salah atau tidak valid.");if(pw.length<6)return alert("Password minimal 6 karakter.");let phone=val("phone").replace(/[\s().-]/g,"");if(!phoneOK(phone))return alert("Nomor WhatsApp tidak valid.");let dup=await sb.from("profiles").select("id").ilike("username",un).limit(1);if(dup.data?.length)return alert("Username sudah digunakan.");let meta={name,username:un,account_type:type,phone};if(type==="driver"){if(!val("car")||!val("plate"))return alert("Lengkapi data Driver.");meta.vehicle_type=val("car");meta.vehicle_plate=val("plate")}if(type==="usaha"){if(!val("bn")||!val("bt")||!val("ba"))return alert("Lengkapi data UMKM / Usaha.");meta.business_name=val("bn");meta.business_type=val("bt");meta.business_address=val("ba")}let r=await sb.auth.signUp({email,password:pw,options:{data:meta,emailRedirectTo:location.origin}});if(r.error){if(/invalid.*email|email.*valid/i.test(r.error.message))return alert("Email salah atau tidak valid.");return alert(r.error.message)}if(!r.data.session){alert("Registrasi berhasil. Silakan konfirmasi email melalui link yang dikirim ke email kamu.");renderAuth("login")}else{user=await sync(r.data.session);closeAuth();show("now")}}
function editProfile(){$("profileModal").classList.remove("hidden");$("profileBox").innerHTML=`<h2>Edit Profile</h2><input id="editName" value="${esc(user.name)}"><input id="editUsername" value="${esc(user.username)}"><button class="btn" onclick="saveProfile()">SAVE</button>`}
async function saveProfile(){let name=val("editName")||user.name,un=val("editUsername")||user.username;if(!userOK(un))return alert("Username tidak valid.");let dup=await sb.from("profiles").select("id").ilike("username",un).neq("id",user.id).limit(1);if(dup.data?.length)return alert("Username sudah digunakan.");let r=await sb.from("profiles").update({name,username:un}).eq("id",user.id);if(r.error)return alert(r.error.message);user.name=name;user.username=un;$("profileModal").classList.add("hidden");show("me")}
function closeProfile(){$("profileModal").classList.add("hidden")}
function logout(){sb.auth.signOut();user=null;localStorage.removeItem("now_user");show()}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));$("plus").onclick=()=>user?openPost():guest();
(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=await sync(r.data.session);show("now")}else guest()})();
</script>
</body>
</html>
