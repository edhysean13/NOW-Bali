<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>NOW BALI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
#app{max-width:430px;min-height:100vh;margin:auto;background:#090b12;padding-bottom:82px}header{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #282d39;position:sticky;top:0;background:#090b12ee;backdrop-filter:blur(15px);z-index:5}
.logo{font-size:27px;font-weight:900}.logo span{color:#ff7438}.live{font-size:10px;color:#55e39a;border:1px solid #28704e;border-radius:20px;padding:6px 9px}.page{padding:15px}.title{display:flex;justify-content:space-between;align-items:center}.title h2{font-size:14px;text-transform:uppercase;margin:10px 0}.muted{color:#8d95a8;font-size:11px}
.card{background:#12151e;border:1px solid #282d39;border-radius:18px;margin:12px 0;overflow:hidden}.row{display:flex;gap:12px;padding:14px;border-bottom:1px solid #242935;align-items:center}.row:last-child{border:0}.row h3{margin:0 0 4px;font-size:14px}.score{font-size:21px;font-weight:900;color:#ff7846;min-width:42px;text-align:center}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#202531}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#ff3fa4,#ff7438);color:#fff;font-weight:800}.btn.secondary{background:#222733}.btn.danger{background:#5a2028}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:74px;background:#0d1018f7;border-top:1px solid #282d39;display:flex;justify-content:space-around;align-items:center;z-index:8}nav button{border:0;background:none;color:#747d91;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.active{color:#ff4da7}nav small{font-size:9px}#plus{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ff3fa4,#ff7438);color:#fff;font-size:27px;border:3px solid #090b12;margin-top:-18px}
.overlay{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end}.hidden{display:none!important}.sheet{width:min(430px,100%);background:#12151e;border-radius:25px 25px 0 0;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;background:none;color:#aaa;font-size:27px}
input,textarea{width:100%;background:#090c13;color:#fff;border:1px solid #303543;border-radius:13px;padding:12px;margin:7px 0;outline:none}textarea{height:110px;resize:none}.notice{padding:11px;border-radius:12px;background:#171c27;color:#aeb5c4;font-size:11px;margin:10px 0}.accountChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.accountChoice{border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:14px;padding:14px 8px;text-align:center;font-weight:800}.accountChoice.active{border-color:#ff5a9f;background:#2b1b2a}.accountChoice span{display:block;font-size:24px;margin-bottom:5px}.formSection{padding:12px 0;border-top:1px solid #252b36;margin-top:10px}.requiredNote{font-size:10px;color:#8991a4;margin:5px 0 10px}.profileHead{text-align:center;padding:22px}.avatar{width:88px;height:88px;border-radius:50%;background:#222733;border:2px solid #ff5a9f;display:grid;place-items:center;margin:auto;font-size:28px;object-fit:cover}.accountLabel{display:inline-block;margin-top:10px;padding:6px 11px;border-radius:99px;background:#202632;border:1px solid #343b4b;font-size:11px;font-weight:800}.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}.stats b{display:block;font-size:18px}.stats span{font-size:10px;color:#8991a4}.driverInfo{margin-top:16px;text-align:left;background:#0d1119;border:1px solid #2b3240;border-radius:16px;padding:14px}.driverItem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #242a35}.driverItem:last-child{border:0}.driverItem div{flex:1}.driverItem b{display:block;font-size:12px}.driverItem span{display:block;color:#8d95a8;font-size:10px;margin-top:2px}.postPhoto{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-top:10px}.actions{display:flex;gap:8px;margin:12px 0}.action{flex:1;border:1px solid #303543;background:#1a1f2a;color:#fff;border-radius:12px;padding:10px}.action.liked{color:#ff7043;border-color:#ff7043}.comment{padding:10px 0;border-bottom:1px solid #252b36}.empty{text-align:center;padding:30px;color:#8991a4;font-size:12px}
.guestPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}.guestCard{width:100%;background:#12151e;border:1px solid #282d39;border-radius:26px;padding:34px 22px;text-align:center}.guestLogo{font-size:46px;font-weight:950}.guestLogo span{color:#ff7438}.guestTitle{font-size:23px;font-weight:900;margin:20px 0 8px}.guestText{color:#8d95a8;font-size:12px;line-height:1.5;margin-bottom:22px}.guestLogin{border:0;background:none;color:#ff6a9e;font-weight:800;padding:12px}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">NOW <span>BALI</span></div><div class="live">● LIVE</div></header>
<main id="main"></main>
<nav><button data-tab="now">🔥<small>NOW</small></button><button data-tab="near">📍<small>NEAR</small></button><button id="plus">+</button><button data-tab="people">👥<small>PEOPLE</small></button><button data-tab="me">◉<small>ME</small></button></nav>
<div id="authModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeAuth()">×</button><div id="authBox"></div></div></div>
<div id="postModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closePost()">×</button><h2>Post NOW</h2><textarea id="postText" placeholder="Apa yang sedang terjadi sekarang?"></textarea><input id="postPlace" placeholder="Lokasi / tempat" value="Canggu Beach"><input id="postPhoto" type="file" accept="image/*"><img id="photoPreview" class="postPhoto hidden"><button class="btn" onclick="publishPost()">POST NOW</button></div></div>
<div id="detailModal" class="overlay hidden"><div class="sheet"><button class="close" onclick="closeDetail()">×</button><div id="detailBox"></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://wjeyyklbcrqxawoxlphk.supabase.co";
const SB_KEY="sb_publishable_d26AD3NNlXOW3oVuJOgVNg_6vNoSb-E";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const main=document.getElementById("main"),authModal=document.getElementById("authModal"),postModal=document.getElementById("postModal"),detailModal=document.getElementById("detailModal");
let user=null, posts=JSON.parse(localStorage.getItem("now_posts_v2")||"[]").map((p,i)=>({...p,id:p.id||"old"+i,likes:p.likes||0,comments:p.comments||[]}));
const places=[["Canggu Beach",94,126,38,"2.4 km","🔥"],["Seminyak",88,74,22,"4.1 km","🎵"],["Kuta Beach",81,61,17,"7.2 km","🌅"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=id=>document.getElementById(id)?.value.trim()||"";
const emailOK=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const userOK=v=>/^[A-Za-z0-9_]{3,30}$/.test(v);
const phoneOK=v=>/^\+?[1-9]\d{7,14}$/.test(String(v).replace(/[\s().-]/g,""));
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"baru saja":m+" min lalu"}
async function profile(session){if(!session?.user)return null;const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();if(error||!p)return null;const u={id:p.id,name:p.name,displayName:p.name,username:p.username,phone:p.phone,accountType:p.account_type};if(p.account_type==="driver"){const {data:d}=await sb.from("driver_profiles").select("*").eq("profile_id",p.id).single();if(d)u.driver={carType:d.vehicle_type,vehicleNumber:d.vehicle_plate,orderPhone:p.phone}}if(p.account_type==="usaha"){const {data:b}=await sb.from("business_profiles").select("*").eq("profile_id",p.id).single();if(b)u.business={name:b.business_name,type:b.business_type,address:b.address,phone:p.phone}}return u}
function renderGuest(){document.querySelector("nav").style.display="none";main.innerHTML=`<div class="guestPage"><div class="guestCard"><div class="guestLogo">NOW <span>BALI</span></div><div class="guestTitle">Selamat datang di NOW Bali</div><div class="guestText">Buat akun untuk mengakses Feed, Near, People, Profile, postingan, komentar dan fitur NOW Bali.</div><button class="btn" onclick="openAuth();renderAuth('register')">REGISTER</button><button class="guestLogin" onclick="openAuth();renderAuth('login')">Sudah punya akun? Login</button></div></div>`}
function show(tab){if(!user){renderGuest();return}document.querySelector("nav").style.display="flex";document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({now:renderNow,near:renderNear,people:renderPeople,me:renderMe}[tab]||renderNow)()}
function renderNow(){main.innerHTML=`<div class="page"><div class="title"><h2>🔥 Happening Now</h2><span class="muted">LIVE</span></div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p[0]}')"><span class="score">${p[1]}</span><div><h3>${p[5]} ${p[0]}</h3><div class="muted">${p[2]} people active • ${p[3]} posts • ${p[4]}</div></div></div>`).join("")}</div><div class="title"><h2>⚡ Live Feed</h2></div><div class="card">${posts.slice(0,12).map(p=>postRow(p)).join("")||`<div class="empty">Belum ada postingan.</div>`}</div></div>`}
function postRow(p){return `<div class="row" onclick='openDetail(${JSON.stringify(p)})'>${p.photo?`<img class="thumb" src="${p.photo}">`:""}<div><h3>${esc(p.t)}</h3><div class="muted">${esc(p.u)} • ${ago(p.time)} • 📍 ${esc(p.place||"Canggu Beach")}</div><span class="muted">🔥 ${p.likes||0} • 💬 ${(p.comments||[]).length}</span></div></div>`}
function renderNear(){main.innerHTML=`<div class="page"><h2>📍 Near You</h2><div class="notice">GPS akan dipakai untuk menentukan lokasi terdekat. Saat ini lokasi demo: Bali.</div><div class="card">${places.map(p=>`<div class="row" onclick="placeDetail('${p[0]}')"><span class="score">${p[1]}</span><div><h3>${p[5]} ${p[0]}</h3><div class="muted">${p[4]} • ${p[2]} people active</div></div></div>`).join("")}</div></div>`}
function placeDetail(name){const p=places.find(x=>x[0]===name)||places[0];main.innerHTML=`<div class="page"><button class="guestLogin" onclick="show('near')">← Kembali</button><h2>${p[5]} ${p[0]}</h2><div class="card"><div class="row"><span class="score">${p[1]}</span><div><h3>${p[2]} people active</h3><div class="muted">${p[3]} posts • ${p[4]}</div></div></div>${posts.filter(x=>(x.place||"Canggu Beach")===p[0]).map(postRow).join("")||`<div class="empty">Belum ada postingan di sini.</div>`}<div class="row"><button class="btn" onclick="openPost('${p[0]}')">➕ Post di sini</button></div></div></div>`}
function renderPeople(){main.innerHTML=`<div class="page"><h2>👥 People</h2><div class="card">${["Made Dharma","Sara Kim","Gus Arya"].map(n=>`<div class="row"><div class="avatar" style="width:52px;height:52px;font-size:18px">${n[0]}</div><div><h3>${n}</h3><div class="muted">🔥 Active • Bali</div></div><button class="btn secondary" style="width:auto;padding:9px;margin-left:auto">FOLLOW</button></div>`).join("")}</div></div>`}
function renderMe(){const mine=posts.filter(p=>p.u===user.name);const icon=user.accountType==="driver"?"🚗":user.accountType==="usaha"?"🏪":"👤";const label=user.accountType==="driver"?"Driver":user.accountType==="usaha"?"Usaha":"Personal";let extra="";if(user.accountType==="driver"&&user.driver)extra=`<div class="driverInfo"><b>🚗 Informasi Driver</b><div class="driverItem"><div><b>${esc(user.driver.carType)}</b><span>Jenis mobil</span></div></div><div class="driverItem"><div><b>${esc(user.driver.vehicleNumber)}</b><span>Nomor kendaraan</span></div></div><div class="driverItem"><div><b>${esc(user.phone)}</b><span>WhatsApp untuk order</span></div></div></div>`;if(user.accountType==="usaha"&&user.business)extra=`<div class="driverInfo"><b>🏪 Informasi Usaha</b><div class="driverItem"><div><b>${esc(user.business.name)}</b><span>Nama usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.type)}</b><span>Jenis usaha</span></div></div><div class="driverItem"><div><b>${esc(user.business.address)}</b><span>Alamat</span></div></div></div>`;main.innerHTML=`<div class="page"><h2>👤 ME</h2><div class="card profileHead"><div class="avatar">${esc((user.name||"U")[0].toUpperCase())}</div><div class="accountLabel">${icon} Akun ${label}</div><h2>${esc(user.displayName||user.name)}</h2><div class="muted">@${esc(user.username)}</div>${extra}<div class="stats"><div><b>${mine.length}</b><span>POSTS</span></div><div><b>0</b><span>FOLLOWERS</span></div><div><b>0</b><span>FOLLOWING</span></div></div><button class="btn danger" onclick="logout()">LOG OUT</button></div><div class="card">${mine.length?mine.map(postRow).join(""):`<div class="empty">Belum ada postingan.<br>Tekan + untuk posting.</div>`}</div></div>`}
function renderAuth(mode="login",type="personal"){if(mode==="login"){authBox.innerHTML=`<h2>Login ke NOW</h2><div class="notice">Gunakan email yang sudah diverifikasi.</div><input id="authEmail" type="email" placeholder="Email"><input id="authPass" type="password" placeholder="Password"><button class="btn" onclick="doAuth('login')">LOGIN</button><p class="muted" style="text-align:center;margin-top:16px">Belum punya akun? <button class="guestLogin" onclick="renderAuth('register')">Register</button></p>`;return}const detail=type==="driver"?`<div class="formSection"><h3>🚗 Data Driver</h3><input id="driverCar" placeholder="Jenis Mobil"><input id="driverVehicle" placeholder="Nomor Kendaraan"><input id="driverPhone" type="tel" placeholder="Nomor WhatsApp"></div>`:type==="usaha"?`<div class="formSection"><h3>🏪 Data Usaha</h3><input id="businessName" placeholder="Nama Usaha"><input id="businessType" placeholder="Jenis Usaha"><input id="businessAddress" placeholder="Alamat Usaha"><input id="businessPhone" type="tel" placeholder="Nomor WhatsApp"></div>`:`<div class="formSection"><h3>👤 Data Personal</h3><input id="personalPhone" type="tel" placeholder="Nomor WhatsApp"></div>`;authBox.innerHTML=`<h2>Buat akun NOW</h2><div class="notice">Semua akun gratis. Email wajib diverifikasi.</div><div class="accountChoices"><button class="accountChoice ${type==="personal"?"active":""}" onclick="renderAuth('register','personal')"><span>👤</span>Personal</button><button class="accountChoice ${type==="driver"?"active":""}" onclick="renderAuth('register','driver')"><span>🚗</span>Driver</button><button class="accountChoice ${type==="usaha"?"active":""}" onclick="renderAuth('register','usaha')"><span>🏪</span>Usaha</button></div><input id="authName" placeholder="Nama"><input id="authUser" placeholder="Username (unik)"><input id="authEmail" type="email" placeholder="Email"><input id="authPass" type="password" placeholder="Password (min. 6 karakter)">${detail}<button class="btn" onclick="doAuth('register','${type}')">REGISTER</button><p class="muted" style="text-align:center;margin-top:16px">Sudah punya akun? <button class="guestLogin" onclick="renderAuth('login')">Login</button></p>`}
function openAuth(){authModal.classList.remove("hidden");renderAuth("login")}function closeAuth(){authModal.classList.add("hidden")}function openPost(place="Canggu Beach"){postModal.classList.remove("hidden");document.getElementById("postPlace").value=place}function closePost(){postModal.classList.add("hidden")}
async function doAuth(mode,type="personal"){try{if(mode==="login"){const email=val("authEmail").toLowerCase(),password=document.getElementById("authPass")?.value||"";if(!emailOK(email))return alert("Email tidak valid.");const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return alert(error.message);user=await profile(data.session);if(!user)return alert("Profil belum tersedia.");localStorage.setItem("now_user",JSON.stringify(user));closeAuth();show("me");return}const name=val("authName"),username=val("authUser"),email=val("authEmail").toLowerCase(),password=document.getElementById("authPass")?.value||"";if(!name)return alert("Isi Nama dulu.");if(!userOK(username))return alert("Username 3–30 karakter, hanya huruf, angka dan underscore.");if(!emailOK(email))return alert("Email tidak valid.");if(password.length<6)return alert("Password minimal 6 karakter.");let phone="",meta={name,username,account_type:type};if(type==="driver"){const car=val("driverCar"),vehicle=val("driverVehicle");phone=val("driverPhone");if(!car||!vehicle)return alert("Lengkapi data Driver.");meta.vehicle_type=car;meta.vehicle_plate=vehicle}else if(type==="usaha"){const bn=val("businessName"),bt=val("businessType"),ad=val("businessAddress");phone=val("businessPhone");if(!bn||!bt||!ad)return alert("Lengkapi data Usaha.");meta.business_name=bn;meta.business_type=bt;meta.business_address=ad}else phone=val("personalPhone");phone=phone.replace(/[\s().-]/g,"");if(!phoneOK(phone))return alert("Nomor WhatsApp tidak valid. Contoh: +628123456789");meta.phone=phone;const {data:dup}=await sb.from("profiles").select("id").ilike("username",username).limit(1);if(dup?.length)return alert("Username sudah digunakan.");const {data,error}=await sb.auth.signUp({email,password,options:{data:meta,emailRedirectTo:location.origin}});if(error)return alert(error.message);if(!data.session){alert("Registrasi berhasil. Cek email dan klik link verifikasi sebelum login.");renderAuth("login")}else{user=await profile(data.session);localStorage.setItem("now_user",JSON.stringify(user));closeAuth();show("me")}}catch(e){console.error(e);alert("Terjadi kesalahan. Silakan coba lagi.")}}
async function logout(){await sb.auth.signOut();user=null;localStorage.removeItem("now_user");show("now")}
let active=null;function openDetail(p){active={...p,likes:p.likes||0,comments:p.comments||[]};detailModal.classList.remove("hidden");renderDetail()}function closeDetail(){detailModal.classList.add("hidden");active=null}
function renderDetail(){detailBox.innerHTML=`<div class="muted">📍 ${esc(active.place||"Canggu Beach")} • ${ago(active.time)}</div><h2>${esc(active.u)}</h2><div style="font-size:17px;line-height:1.45">${esc(active.t)}</div>${active.photo?`<img class="postPhoto" src="${active.photo}">`:""}<div class="actions"><button class="action ${active.liked?"liked":""}" onclick="likePost()">🔥 ${active.likes}</button><button class="action">💬 ${active.comments.length}</button></div><div style="display:flex;gap:7px"><input id="commentInput" placeholder="Tulis komentar..." style="margin:0"><button class="btn" style="width:auto;padding:10px" onclick="commentPost()">KIRIM</button></div><h3>Komentar</h3>${active.comments.map(c=>`<div class="comment"><b>${esc(c.u)}</b><div class="muted">${esc(c.t)}</div></div>`).join("")||`<div class="muted">Belum ada komentar.</div>`}`}
function likePost(){active.liked=!active.liked;active.likes=Math.max(0,active.likes+(active.liked?1:-1));saveActive();renderDetail()}function commentPost(){const t=val("commentInput");if(!t)return;active.comments.push({u:user.name,t});saveActive();renderDetail()}function saveActive(){const i=posts.findIndex(p=>p.id===active.id);if(i>=0){posts[i]={...posts[i],likes:active.likes,comments:active.comments};localStorage.setItem("now_posts_v2",JSON.stringify(posts))}}
function publishPost(){const t=val("postText"),place=val("postPlace")||"Canggu Beach",f=document.getElementById("postPhoto").files[0];if(!t)return alert("Tulis dulu apa yang sedang terjadi.");const save=photo=>{posts.unshift({id:"p"+Date.now(),t,u:user.name,place,time:Date.now(),photo,likes:0,comments:[]});localStorage.setItem("now_posts_v2",JSON.stringify(posts));document.getElementById("postText").value="";document.getElementById("postPhoto").value="";closePost();show("now")};if(f){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save("")}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));document.getElementById("plus").onclick=()=>user?openPost():openAuth();
(async()=>{const {data}=await sb.auth.getSession();if(data.session)user=await profile(data.session);else user=null;show(user?"now":"now")})();
</script>
</body>
</html>
