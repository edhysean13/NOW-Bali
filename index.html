async function syncLegacyBusinessPosts(){
  if(user?.accountType!=="usaha"||!user?.id)return;
  let legacy=[];
  try{legacy=JSON.parse(localStorage.getItem("now_posts_v2")||"[]")}catch(e){legacy=[]}
  if(!Array.isArray(legacy)||!legacy.length)return;
  const mine=legacy.filter(x=>x&&x.u===user.name&&x.t);
  if(!mine.length)return;

  const existing=await sb.from("business_posts")
    .select("caption,created_at")
    .eq("user_id",user.id)
    .limit(200);
  if(existing.error)return;

  const keys=new Set((existing.data||[]).map(x=>`${x.caption}|${new Date(x.created_at).getTime()}`));
  const rows=mine.filter(x=>{
    const k=`${x.t}|${new Date(x.time||Date.now()).getTime()}`;
    if(keys.has(k))return false;
    keys.add(k);
    return true;
  }).map(x=>({
    user_id:user.id,
    caption:x.t,
    image_url:x.photo||"",
    location:x.place||"Canggu Beach",
    category:x.category||"other",
    created_at:new Date(x.time||Date.now()).toISOString()
  }));
  if(rows.length)await sb.from("business_posts").insert(rows);
}

async function loadMorePackages(first=false){
  if(discoverLoading||!discoverHasMore)return;
  discoverLoading=true;
  const box=$("peopleResults");
  const wrap=$("loadMoreWrap");
  if(!box){discoverLoading=false;return;}

  if(first)box.innerHTML=`<div class="loading">Memuat Paket Liburan...</div>`;
  else if(wrap)wrap.innerHTML=`<div class="loading">Memuat paket berikutnya...</div>`;

  const pageSize=12;
  const from=discoverPage*pageSize;
  const to=from+pageSize-1;

  let query=sb.from("travel_packages")
    .select("id,owner_id,title,price,duration_hours,description,itinerary,hotel,restaurant,photo_url,is_published,created_at,view_count,like_count,comment_count")
    .eq("is_published",true)
    .order("like_count",{ascending:false})
    .order("comment_count",{ascending:false})
    .order("created_at",{ascending:false})
    .range(from,to);

  const raw=(val("peopleSearch")||"").trim().replace(/[(),]/g," ");
  if(raw){
    const s=raw.replace(/\s+/g," ");
    query=query.or(`title.ilike.%${s}%,description.ilike.%${s}%,itinerary.ilike.%${s}%,hotel.ilike.%${s}%,restaurant.ilike.%${s}%`);
  }

  if(discoverDuration==="8")query=query.gte("duration_hours",7).lte("duration_hours",12);
  if(discoverDuration==="24")query=query.gt("duration_hours",12).lte("duration_hours",24);
  if(discoverDuration==="48")query=query.gt("duration_hours",24);

  const pkg=await query;
  if(pkg.error){
    box.innerHTML=`<div class="empty">${esc(pkg.error.message)}</div>`;
    discoverLoading=false;
    return;
  }

  const rows=pkg.data||[];
  discoverHasMore=rows.length===pageSize;
  discoverPage++;

  const ids=[...new Set(rows.map(x=>x.owner_id).filter(Boolean))];
  const pr=ids.length
    ? await sb.from("profiles").select("id,name,username,phone,account_type,avatar_url").in("id",ids)
    : {data:[]};
  const owners=new Map((pr.data||[]).map(x=>[x.id,x]));

  if(first)box.innerHTML="";
  if(!rows.length&&first)box.innerHTML=`<div class="empty">Belum ada Paket Liburan yang cocok.</div>`;

  rows.forEach(p=>{
    const d=owners.get(p.owner_id)||{};
    box.insertAdjacentHTML("beforeend",discoverPackageCard(p,d));
  });

  if(wrap){
    wrap.innerHTML=discoverHasMore
      ? `<button class="btn secondary" onclick="loadMorePackages()">Lihat paket berikutnya</button>`
      : (rows.length?`<div class="muted" style="padding:10px">Semua paket yang cocok sudah ditampilkan.</div>`:"");
  }
  discoverLoading=false;
}

async function searchPeople(){
  if(discoverMode==="packages"){resetDiscovery();return;}
  const box=$("peopleResults"); if(!box)return;
  const q=(val("peopleSearch")||"").toLowerCase();
  const category=window.__businessPostCategory||"all";
  box.innerHTML=`<div class="loading">Memuat postingan UMKM...</div>`;

  let query=sb.from("business_posts")
    .select("id,user_id,caption,image_url,location,category,created_at")
    .order("created_at",{ascending:false})
    .limit(60);
  if(category!=="all")query=query.eq("category",category);

  const r=await query;
  if(r.error){box.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;return;}
  const posts=r.data||[];
  if(!posts.length){box.innerHTML=`<div class="empty">Belum ada postingan UMKM di kategori ini.</div>`;return;}

  const ids=[...new Set(posts.map(x=>x.user_id))];
  const [pr,br]=await Promise.all([
    sb.from("profiles").select("id,name,username,phone,avatar_url").in("id",ids),
    sb.from("business_profiles").select("profile_id,business_name,business_type,address").in("profile_id",ids)
  ]);
  const profiles=new Map((pr.data||[]).map(x=>[x.id,x]));
  const businesses=new Map((br.data||[]).map(x=>[x.profile_id,x]));

  const filtered=posts.filter(x=>{
    const p=profiles.get(x.user_id)||{},b=businesses.get(x.user_id)||{};
    const hay=`${x.caption} ${x.location} ${x.category} ${p.name} ${p.username} ${b.business_name} ${b.business_type} ${b.address}`.toLowerCase();
    return !q||hay.includes(q);
  });

  box.innerHTML=filtered.length
    ? filtered.map(x=>businessPostCard(x,profiles.get(x.user_id)||{},businesses.get(x.user_id)||{})).join("")
    : `<div class="empty">Tidak ada postingan UMKM yang cocok.</div>`;

async function startDriverChat(driver){
  driver=driver||window.__chatDriver||{};
  window.__chatDriver=driver;
  const packageId=window.__activePackage?.id;
  const customerId=user?.id;
  const driverId=driver?.id;

  if(!customerId){alert("Silakan login sebagai Customer terlebih dahulu.");return;}
  if(!driverId){alert("Profil Driver belum memiliki ID yang valid.");return;}
  if(!packageId){alert("Paket belum terhubung dengan Driver.");return;}

  $("profileModal").classList.remove("hidden");
  $("profileBox").innerHTML=`<div class="chatHead">
      <button class="guestLogin" id="chatBackBtn">← Kembali</button>
      <div><h2>💬 Chat ${esc(driver.name||"Driver")}</h2><p class="muted">@${esc(driver.username||"")} • 🚗 Driver</p></div>
    </div>
    <div id="chatMessages" class="chatMessages"><div class="loading">Menghubungkan chat...</div></div>
    <div class="chatComposer">
      <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
      <button id="chatSendBtn" class="action" type="button">Kirim</button>
    </div>
    <div class="notice">Pesan dikirim melalui NOW BALI dan tersimpan di Supabase. Driver dapat menerimanya saat membuka akun Driver.</div>`;

  window.__activeChat={driver,packageId,customerId,conversationId:null,channel:null};

  const back=$("chatBackBtn");
  if(back)back.onclick=()=>openPublicPackage(window.__activePackage||{},driver);
  const send=$("chatSendBtn");
  if(send)send.onclick=sendDriverChat;
  const input=$("chatInput");
  if(input)input.onkeydown=e=>{if(e.key==="Enter")sendDriverChat();};

  // Find or create the conversation for this customer + driver + package.
  let {data:conv,error}=await sb.from("chat_conversations")
    .select("id")
    .eq("customer_id",customerId)
    .eq("driver_id",driverId)
    .eq("package_id",packageId)
    .maybeSingle();

  if(error){$("chatMessages").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return;}

  if(!conv){
    const ins=await sb.from("chat_conversations").insert({
      customer_id:customerId,driver_id:driverId,package_id:packageId
    }).select("id").single();
    conv=ins.data;
    error=ins.error;
    if(error){$("chatMessages").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return;}
  }

  window.__activeChat.conversationId=conv.id;

  const loaded=await sb.from("chat_messages")
    .select("id,sender_id,body,created_at")
    .eq("conversation_id",conv.id)
    .order("created_at",{ascending:true});

  if(loaded.error){$("chatMessages").innerHTML=`<div class="empty">${esc(loaded.error.message)}</div>`;return;}
  renderChatMessages(loaded.data||[]);

  if(window.__chatChannel){try{await sb.removeChannel(window.__chatChannel);}catch(e){}}
  window.__chatChannel=sb.channel(`chat-${conv.id}`)
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"chat_messages",filter:`conversation_id=eq.${conv.id}`},
      payload=>{
        const current=document.querySelectorAll("#chatMessages .chatBubble");
        const existing=[...current].some(x=>x.dataset.id===payload.new.id);
        if(!existing){
          appendChatMessage(payload.new);
        }
      })
    .subscribe();

  setTimeout(()=>{$("chatInput")?.focus();scrollChatToBottom()},50);
}

function renderChatMessages(messages){
  const box=$("chatMessages");
  if(!box)return;
  box.innerHTML=messages.length
    ? messages.map(chatMessageHtml).join("")
    : `<div class="empty">Belum ada pesan. Mulai percakapan dengan Driver.</div>`;
  scrollChatToBottom();
}

function chatMessageHtml(m){
  const mine=m.sender_id===user?.id;
  return `<div class="chatBubble ${mine?"me":"them"}" data-id="${esc(m.id)}">${esc(m.body)}</div>`;
}

function appendChatMessage(m){
  const box=$("chatMessages");
  if(!box)return;
  const empty=box.querySelector(".empty");
  if(empty)empty.remove();
  box.insertAdjacentHTML("beforeend",chatMessageHtml(m));
  scrollChatToBottom();
}

function scrollChatToBottom(){
  const box=$("chatMessages");
  if(box)box.scrollTop=box.scrollHeight;
}

async function sendDriverChat(){
  const input=$("chatInput");
  const chat=window.__activeChat;
  if(!input||!chat?.conversationId)return;
  const text=input.value.trim();
  if(!text)return;

  const btn=$("chatSendBtn");
  if(btn){btn.disabled=true;btn.textContent="Mengirim...";}

  const r=await sb.from("chat_messages").insert({
    conversation_id:chat.conversationId,
    sender_id:user.id,
    body:text
  }).select("id,sender_id,body,created_at").single();

  if(r.error){
    alert("Pesan belum terkirim: "+r.error.message);
  }else{
    input.value="";
    // Realtime normally appends it; append immediately only if subscription has not done so.
    const box=$("chatMessages");
    if(box && !box.querySelector(`[data-id="${r.data.id}"]`))appendChatMessage(r.data);
  }
  if(btn){btn.disabled=false;btn.textContent="Kirim";}
}

async function openExistingChat(conversation,customer,pack){

  const loaded=await sb.from("chat_messages").select("id,sender_id,body,created_at").eq("conversation_id",conversation.id).order("created_at",{ascending:true});
  if(loaded.error){$("chatMessages").innerHTML=`<div class="empty">${esc(loaded.error.message)}</div>`;return;}

  if(input)input.onkeydown=e=>{if(e.key==="Enter")sendDriverChat();};

    .on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages",filter:`conversation_id=eq.${conversation.id}`},
      payload=>{const box=$("chatMessages");if(box&&!box.querySelector(`[data-id="${payload.new.id}"]`))appendChatMessage(payload.new);})
    .subscribe();
  setTimeout(()=>input?.focus(),50);
}

async function publishPost(){
  let t=val("postText"),category=val("postCategory"),place=val("postPlace")||"Canggu Beach",f=$("postPhoto").files[0],video=postSelectedVideo||$("postVideo")?.files?.[0];
  if(!t)return alert("Tulis dulu apa yang sedang terjadi.");
  if(!category)return alert("Pilih kategori postingan terlebih dahulu.");
  if(video){
    if(video.size>50*1024*1024)return alert("Video maksimal 50 MB.");
    const ext=(video.name.split('.').pop()||'mp4').toLowerCase();
    const path=`${user.id}/${crypto.randomUUID()}.${ext}`;
    const up=await sb.storage.from('near-videos').upload(path,video,{contentType:video.type,upsert:false});
    if(up.error)return alert('Video gagal diupload: '+up.error.message);
    const url=sb.storage.from('near-videos').getPublicUrl(path).data.publicUrl;
    const r=await sb.from('near_videos').insert({user_id:user.id,video_url:url,caption:t,location:place}).select().single();
    if(r.error){await sb.storage.from('near-videos').remove([path]);return alert('Video gagal dibuat: '+r.error.message)}
    resetPostComposer();closePost();show('near');return;
  }
  let done=async photo=>{
    posts.unshift({id:"p"+Date.now(),t,u:user.name,place,category,time:Date.now(),photo,likes:0,comments:[]});
    localStorage.setItem("now_posts_v2",JSON.stringify(posts));
    if(user?.accountType==="usaha"){
      const r=await sb.from("business_posts").insert({user_id:user.id,caption:t,image_url:photo||"",location:place,category});
      if(r.error)return alert("Postingan tersimpan di Feed lokal, tetapi gagal masuk PEOPLE: "+r.error.message);
    }
    resetPostComposer();closePost();show("now");
  };
  if(f){if(f.size>8*1024*1024)return alert("Foto maksimal 8 MB.");let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("");
}

function renderAuth(mode="login",type="personal"){if(mode==="login"){authBox.innerHTML=`<h2>Login ke NOW</h2><div class="notice">Gunakan email yang sudah diverifikasi.</div><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">LOGIN</button><p class="muted" style="text-align:center">Belum punya akun? <button class="guestLogin" onclick="renderAuth('register','personal')">Register</button></p>`;return}let extra=type==="driver"?`<input id="car" placeholder="Jenis Mobil"><input id="plate" placeholder="Nomor Kendaraan"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:type==="usaha"?`<input id="bn" placeholder="Nama Usaha"><input id="bt" placeholder="Jenis Usaha"><input id="ba" placeholder="Alamat Usaha"><input id="phone" type="tel" placeholder="Nomor WhatsApp">`:`<input id="phone" type="tel" placeholder="Nomor WhatsApp">`;authBox.innerHTML=`<h2>Buat akun NOW</h2><div class="notice">Semua akun gratis.</div><div class="accountChoices"><button class="accountChoice ${type==="personal"?"active":""}" onclick="renderAuth('register','personal')"><span>👤</span>Personal</button><button class="accountChoice ${type==="driver"?"active":""}" onclick="renderAuth('register','driver')"><span>🚗</span>Driver</button><button class="accountChoice ${type==="usaha"?"active":""}" onclick="renderAuth('register','usaha')"><span>🏪</span>UMKM</button></div><input id="regName" placeholder="Nama"><input id="regUsername" placeholder="Username (unik)"><input id="regEmail" type="email" placeholder="Email">${extra}<input id="regPassword" type="password" placeholder="Password (min. 6 karakter)"><button class="btn" onclick="doRegister('${type}')">REGISTER</button><p class="muted" style="text-align:center">Sudah punya akun? <button class="guestLogin" onclick="renderAuth('login')">Login</button></p>`}
async function doLogin(){let email=val("loginEmail").toLowerCase(),password=$("loginPassword").value;if(!emailOK(email))return alert("Email salah atau tidak valid.");let r=await sb.auth.signInWithPassword({email,password});if(r.error)return alert(r.error.message);user=await sync(r.data.session);if(!user)return alert("Profil belum tersedia.");closeAuth();show("now")}
async function doRegister(type){let name=val("regName"),un=val("regUsername"),email=val("regEmail").toLowerCase(),pw=$("regPassword").value;if(!name)return alert("Isi Nama dulu.");if(!userOK(un))return alert("Username 3–30 karakter, hanya huruf, angka dan underscore.");if(!emailOK(email))return alert("Email salah atau tidak valid.");if(pw.length<6)return alert("Password minimal 6 karakter.");let phone=val("phone").replace(/[\s().-]/g,"");if(!phoneOK(phone))return alert("Nomor WhatsApp tidak valid.");let dup=await sb.from("profiles").select("id").ilike("username",un).limit(1);if(dup.data?.length)return alert("Username sudah digunakan.");let meta={name,username:un,account_type:type,phone};if(type==="driver"){if(!val("car")||!val("plate"))return alert("Lengkapi data Driver.");meta.vehicle_type=val("car");meta.vehicle_plate=val("plate")}if(type==="usaha"){if(!val("bn")||!val("bt")||!val("ba"))return alert("Lengkapi data UMKM / Usaha.");meta.business_name=val("bn");meta.business_type=val("bt");meta.business_address=val("ba")}let r=await sb.auth.signUp({email,password:pw,options:{data:meta,emailRedirectTo:location.origin}});if(r.error){if(/invalid.*email|email.*valid/i.test(r.error.message))return alert("Email salah atau tidak valid.");return alert(r.error.message)}if(!r.data.session){alert("Registrasi berhasil. Silakan konfirmasi email melalui link yang dikirim ke email kamu.");renderAuth("login")}else{user=await sync(r.data.session);closeAuth();show("now")}}
function editProfile(){
  $("profileModal").classList.remove("hidden");
  $("profileBox").innerHTML=`<h2>Edit Profile</h2>
    <div style="text-align:center;margin:12px 0">
      <div id="editAvatarPreview">${avatar(user)}</div>
      <label class="btn secondary" style="display:inline-block;margin-top:10px;cursor:pointer">
        📷 Ganti Foto
        <input id="editAvatarFile" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
      </label>
    </div>
    <input id="editName" value="${esc(user.name)}" placeholder="Nama">
    <input id="editUsername" value="${esc(user.username)}" placeholder="Username">
    <button class="btn" id="saveProfileBtn">SAVE</button>
    <div id="editProfileStatus" class="muted" style="text-align:center;margin-top:8px"></div>`;

  $("editAvatarFile").onchange=()=>{
    const file=$("editAvatarFile").files?.[0];
    if(!file)return;
    if(file.size>5*1024*1024)return alert("Foto maksimal 5 MB.");
    const reader=new FileReader();
    reader.onload=()=>{$("editAvatarPreview").innerHTML=`<img class="avatar" src="${reader.result}">`;};
    reader.readAsDataURL(file);
  };
  $("saveProfileBtn").onclick=saveProfile;
}

async function saveProfile(){
  const btn=$("saveProfileBtn"),status=$("editProfileStatus");
  let name=val("editName")||user.name,un=val("editUsername")||user.username;
  if(!userOK(un))return alert("Username tidak valid.");
  let dup=await sb.from("profiles").select("id").ilike("username",un).neq("id",user.id).limit(1);
  if(dup.error)return alert(dup.error.message);
  if(dup.data?.length)return alert("Username sudah digunakan.");

  btn.disabled=true;
  if(status)status.textContent="Menyimpan...";
  let avatarUrl=user.photo||"";
  const file=$("editAvatarFile")?.files?.[0];

  if(file){
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
    const path=`${user.id}/avatar.${ext}`;
    const up=await sb.storage.from("avatars").upload(path,file,{upsert:true,contentType:file.type});
    if(up.error){
      btn.disabled=false;
      if(status)status.textContent="";
      return alert("Foto gagal diupload: "+up.error.message);
    }
    avatarUrl=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+`?v=${Date.now()}`;
  }

  const r=await sb.from("profiles").update({name,username:un,avatar_url:avatarUrl}).eq("id",user.id);
  if(r.error){
    btn.disabled=false;
    if(status)status.textContent="";
    return alert(r.error.message);
  }

  user.name=name;
  user.displayName=user.accountType==="usaha"&&user.business?.name?user.business.name:name;
  user.username=un;
  user.photo=avatarUrl;

  $("profileModal").classList.add("hidden");
  show("me");
}
function closeProfile(){$("profileModal").classList.add("hidden")}
function logout(){sb.auth.signOut();user=null;localStorage.removeItem("now_user");show()}
// ===== NOW STORY + NOW LIVE =====
let storyItems=[]; let currentStory=null; let storySelectedFile=null; let liveHost=null; let liveChannel=null; let liveStream=null; let livePeers={}; let liveViewerChannel=null; let liveViewerPeer=null; let liveViewerTimer=null;
function openComposerTab(tab){
  ['post','story','live'].forEach(x=>{let p=$("composer"+x.charAt(0).toUpperCase()+x.slice(1)+"Panel"),b=$("composer"+x.charAt(0).toUpperCase()+x.slice(1)+"Tab");if(p)p.classList.toggle('hidden',x!==tab);if(b)b.classList.toggle('active',x===tab)});
}
function openPost(place="Canggu Beach"){if(!user)return guest();$("postModal").classList.remove("hidden");$("postPlace").value=place;$("postCategory").value="";openComposerTab('post')}
function closePost(){$("postModal").classList.add("hidden")}
function setStoryFile(file){
  storySelectedFile=file||null;
  const name=$("storyMediaName"); const preview=$("storyMediaPreview");
  if(!file){if(name)name.textContent='Pilih Ambil Foto, Rekam Video, atau Galeri.';if(preview){preview.innerHTML='';preview.classList.add('hidden')}return}
  if(name)name.textContent=`Dipilih: ${file.name}`;
  if(preview){preview.classList.remove('hidden');const u=URL.createObjectURL(file);preview.innerHTML=file.type.startsWith('video/')?`<video src="${u}" controls playsinline></video>`:`<img src="${u}" alt="Preview Story">`}
}
function openStoryCamera(mode){
  const input=$(mode==='photo'?'storyCameraPhoto':'storyCameraVideo'); if(!input)return;
  input.value=''; input.onchange=()=>{const f=input.files?.[0];if(f)setStoryFile(f)}; input.click();
}
function openStoryGallery(){
  const input=$("storyMedia"); if(!input)return;
  input.value=''; input.onchange=()=>{const f=input.files?.[0];if(f)setStoryFile(f)}; input.click();
}
async function publishStory(){
  if(!user?.id)return guest();
  const file=storySelectedFile || $("storyMedia")?.files?.[0]; if(!file)return alert("Ambil foto, rekam video, atau pilih dari galeri terlebih dahulu.");
  if(!/^image\/(jpeg|png|webp|gif)$|^video\//.test(file.type))return alert("Format media tidak didukung.");
  const ext=(file.name.split('.').pop()||'bin').toLowerCase(), path=`${user.id}/${crypto.randomUUID()}.${ext}`;
  const up=await sb.storage.from('now-stories').upload(path,file,{contentType:file.type,upsert:false});
  if(up.error)return alert('Story gagal diupload: '+up.error.message);
  const url=sb.storage.from('now-stories').getPublicUrl(path).data.publicUrl;
  const r=await sb.from('stories').insert({user_id:user.id,media_url:url,media_type:file.type.startsWith('video/')?'video':'image',caption:val('storyCaption'),location:val('storyPlace')}).select().single();
  if(r.error){await sb.storage.from('now-stories').remove([path]);return alert('Story gagal dibuat: '+r.error.message)}
  $("storyMedia").value='';$("storyCameraPhoto").value='';$("storyCameraVideo").value='';storySelectedFile=null;setStoryFile(null);$("storyCaption").value='';closePost();show('now');
}
async function loadStoriesStrip(){
  const wrap=$("storyStripWrap"); if(!wrap||!user?.id)return;
  const r=await sb.from('stories').select('id,user_id,media_url,media_type,caption,location,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(20);
  if(r.error){wrap.innerHTML='';return}
  const rows=r.data||[]; storyItems=rows;
  const ids=[...new Set(rows.map(x=>x.user_id))]; const pr=ids.length?await sb.from('profiles').select('id,name,avatar_url').in('id',ids):{data:[]}; const pm=new Map((pr.data||[]).map(x=>[x.id,x]));
  // Satu bubble per pengguna; Story milik sendiri selalu paling depan setelah tombol +.
  const grouped=[]; const seen=new Set();
  const ordered=[...rows].sort((a,b)=>{const am=a.user_id===user.id?0:1,bm=b.user_id===user.id?0:1;return am-bm||new Date(b.created_at)-new Date(a.created_at)});
  for(const x of ordered){if(seen.has(x.user_id))continue;seen.add(x.user_id);grouped.push(x)}
  wrap.innerHTML=`<div class="title"><h2>📸 NOW Story</h2><span class="muted">24 jam</span></div><div class="storyStrip"><div class="storyBubble" onclick="openComposerTabFromHome('story')"><div class="storyRing storyAdd">+</div><div>Story kamu</div></div>${grouped.map(x=>{const u=pm.get(x.user_id)||{};const label=x.user_id===user.id?'Story kamu':(u.name||'NOW BALI');return `<div class="storyBubble" onclick="openStoryViewer('${x.id}')"><div class="storyRing">${x.media_type==='video'?`<video src="${esc(x.media_url)}" muted playsinline></video>`:`<img src="${esc(u.avatar_url||x.media_url)}">`}</div><div>${esc(label)}</div></div>`}).join('')}</div>`;
}
function openComposerTabFromHome(tab){$("postModal").classList.remove('hidden');openComposerTab(tab)}
async function openStoryViewer(id){
  const r=await sb.from('stories').select('*').eq('id',id).maybeSingle(); if(r.error||!r.data)return; currentStory=r.data;
  $("storyViewerModal").classList.remove('hidden'); await sb.from('story_views').upsert({story_id:id,user_id:user.id},{onConflict:'story_id,user_id'}); await renderStoryViewer();
}
async function renderStoryViewer(){
  const s=currentStory;if(!s)return; const [v,react]=await Promise.all([sb.from('story_views').select('user_id',{count:'exact',head:true}).eq('story_id',s.id),sb.from('story_reactions').select('user_id').eq('story_id',s.id).eq('user_id',user.id).maybeSingle()]);
  const media=s.media_type==='video'?`<video class="storyViewerMedia" src="${esc(s.media_url)}" controls autoplay playsinline></video>`:`<img class="storyViewerMedia" src="${esc(s.media_url)}">`;
  $("storyViewerBox").innerHTML=`${media}<div class="storyStats"><span>📍 ${esc(s.location||'Bali')} · ${ago(new Date(s.created_at).getTime())}</span><span>👁️ ${v.count||0}</span></div><div>${esc(s.caption||'')}</div><div class="actions"><button class="action ${react.data?'liked':''}" onclick="toggleStoryReaction()">🔥 ${react.data?'Sudah direaksi':'React'}</button>${s.user_id===user.id?`<button class="action" onclick="deleteCurrentStory()">Hapus</button>`:''}</div>`;
}
async function toggleStoryReaction(){if(!currentStory)return;const q=await sb.from('story_reactions').select('story_id').eq('story_id',currentStory.id).eq('user_id',user.id).maybeSingle();if(q.data)await sb.from('story_reactions').delete().eq('story_id',currentStory.id).eq('user_id',user.id);else await sb.from('story_reactions').insert({story_id:currentStory.id,user_id:user.id,reaction:'🔥'});renderStoryViewer()}
async function deleteCurrentStory(){
  if(!currentStory||currentStory.user_id!==user.id)return;
  if(!confirm('Hapus Story ini?'))return;
  const mediaUrl=currentStory.media_url||'';
  const r=await sb.from('stories').delete().eq('id',currentStory.id).eq('user_id',user.id);
  if(r.error)return alert('Story gagal dihapus: '+r.error.message);
  try{
    const marker='/storage/v1/object/public/now-stories/';
    const i=mediaUrl.indexOf(marker);
    if(i>=0){const path=decodeURIComponent(mediaUrl.slice(i+marker.length));await sb.storage.from('now-stories').remove([path]);}
  }catch(e){}
  closeStoryViewer();show('now');
}
function closeStoryViewer(){$("storyViewerModal").classList.add('hidden');currentStory=null}
async function loadLiveNow(){
  const wrap=$("liveNowWrap");if(!wrap||!user?.id)return; const r=await sb.from('live_sessions').select('id,host_id,title,location,status,started_at').eq('status','live').order('started_at',{ascending:false}).limit(10);if(r.error)return;
  const rows=r.data||[]; if(!rows.length){wrap.innerHTML='';return} const ids=[...new Set(rows.map(x=>x.host_id))];const pr=await sb.from('profiles').select('id,name,avatar_url').in('id',ids);const pm=new Map((pr.data||[]).map(x=>[x.id,x]));
  wrap.innerHTML=`<div class="title"><h2>🔴 NOW Live</h2><span class="muted">LIVE sekarang</span></div><div class="card">${rows.map(x=>{const u=pm.get(x.host_id)||{};return `<div class="liveCard" onclick="openLiveViewer('${x.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.title)}</b><div class="muted">${esc(u.name||'NOW BALI')} · 📍 ${esc(x.location||'Bali')}</div></div><span class="liveBadge">● LIVE</span></div></div>`}).join('')}</div>`;
}
async function startNowLive(){
  if(!user?.id)return guest(); const title=val('liveTitleInput'); if(!title)return alert('Judul LIVE wajib diisi.');
  try{liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true})}catch(e){return alert('Kamera/mikrofon tidak bisa digunakan: '+e.message)}
  const r=await sb.from('live_sessions').insert({host_id:user.id,title,location:val('livePlaceInput'),status:'live'}).select().single();if(r.error){liveStream.getTracks().forEach(t=>t.stop());return alert('NOW Live gagal dibuat: '+r.error.message)}
  closePost();await openLiveHost(r.data);loadLiveNow();
}
async function openLiveHost(session){
  liveHost=session;$("liveModal").classList.remove('hidden');$("liveModal").querySelector('.close').onclick=()=>endNowLive();
  $("liveBox").innerHTML=`<div class="liveBadge">● LIVE</div><h2>${esc(session.title)}</h2><video id="liveHostVideo" class="liveVideo" autoplay muted playsinline></video><div class="muted">📍 ${esc(session.location||'Bali')} · Anda sedang siaran</div><div id="liveViewerCount" class="storyStats"><span>👥 0 penonton</span></div><div class="liveHostControls"><button class="btn danger" onclick="endNowLive()">⏹ AKHIRI LIVE</button></div>`;
  $("liveHostVideo").srcObject=liveStream;
  liveChannel=sb.channel('live:'+session.id,{config:{presence:{key:user.id}}});
  liveChannel.on('presence',{event:'sync'},()=>{const st=liveChannel.presenceState();const n=Math.max(0,Object.keys(st).length-1);const el=$("liveViewerCount");if(el)el.innerHTML=`<span>👥 ${n} penonton</span>`});
  liveChannel.on('broadcast',{event:'viewer-offer'},async({payload})=>{const viewerId=payload.viewer_id;if(!viewerId||!payload.offer)return;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});livePeers[viewerId]=pc;liveStream.getTracks().forEach(t=>pc.addTrack(t,liveStream));pc.onicecandidate=e=>{if(e.candidate)liveChannel.send({type:'broadcast',event:'host-ice',payload:{viewer_id:viewerId,candidate:e.candidate}})};await pc.setRemoteDescription(payload.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);liveChannel.send({type:'broadcast',event:'viewer-answer',payload:{viewer_id:viewerId,answer}})});
  liveChannel.on('broadcast',{event:'viewer-ice'},async({payload})=>{const pc=livePeers[payload.viewer_id];if(pc&&payload.candidate)try{await pc.addIceCandidate(payload.candidate)}catch(e){}});
  await liveChannel.subscribe(async status=>{if(status==='SUBSCRIBED')await liveChannel.track({user_id:user.id,role:'host'})});
}
async function openLiveViewer(id){
  const r=await sb.from('live_sessions').select('*').eq('id',id).eq('status','live').maybeSingle();if(r.error||!r.data)return alert('LIVE sudah berakhir.'); const session=r.data;
  $("liveModal").classList.remove('hidden');$("liveModal").querySelector('.close').onclick=()=>closeLiveModal();$("liveBox").innerHTML=`<div class="liveBadge">● LIVE</div><h2>${esc(session.title)}</h2><video id="liveViewerVideo" class="liveVideo" autoplay playsinline></video><div class="muted">📍 ${esc(session.location||'Bali')}</div><div id="liveChat" class="liveChat"><div class="muted">Memuat komentar...</div></div><div style="display:flex;gap:8px;margin-top:8px"><input id="liveCommentInput" placeholder="Tulis komentar..." style="margin:0"><button class="btn small" onclick="sendLiveComment('${id}')">KIRIM</button></div>`;
  liveViewerChannel=sb.channel('live:'+id,{config:{presence:{key:user.id}}}); liveViewerChannel.on('presence',{event:'sync'},()=>{const st=liveViewerChannel.presenceState();const el=$("liveChat");if(el&&el.previousElementSibling){} }); liveViewerPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  liveViewerPeer.ontrack=e=>{$("liveViewerVideo").srcObject=e.streams[0]};
  liveViewerPeer.onicecandidate=e=>{if(e.candidate)liveViewerChannel.send({type:'broadcast',event:'viewer-ice',payload:{viewer_id:user.id,candidate:e.candidate}})};
  liveViewerChannel.on('broadcast',{event:'viewer-answer'},async({payload})=>{if(payload.viewer_id===user.id&&payload.answer)await liveViewerPeer.setRemoteDescription(payload.answer)});
  liveViewerChannel.on('broadcast',{event:'host-ice'},async({payload})=>{if(payload.viewer_id===user.id&&payload.candidate)try{await liveViewerPeer.addIceCandidate(payload.candidate)}catch(e){}});
  await liveViewerChannel.subscribe(async status=>{if(status!=='SUBSCRIBED')return;await liveViewerChannel.track({user_id:user.id,role:'viewer'});const offer=await liveViewerPeer.createOffer();await liveViewerPeer.setLocalDescription(offer);liveViewerChannel.send({type:'broadcast',event:'viewer-offer',payload:{viewer_id:user.id,offer}})});
  await loadLiveComments(id);liveViewerTimer=setInterval(()=>loadLiveComments(id),2500);
}
async function loadLiveComments(id){const box=$("liveChat");if(!box)return;const r=await sb.from('live_comments').select('body,user_id,created_at').eq('live_id',id).order('created_at',{ascending:true}).limit(100);if(r.error)return;const ids=[...new Set((r.data||[]).map(x=>x.user_id))];const pr=ids.length?await sb.from('profiles').select('id,name').in('id',ids):{data:[]};const pm=new Map((pr.data||[]).map(x=>[x.id,x.name]));box.innerHTML=(r.data||[]).map(x=>`<div class="liveChatRow"><b>${esc(pm.get(x.user_id)||'User')}</b> ${esc(x.body)}</div>`).join('')||`<div class="muted">Belum ada komentar.</div>`;box.scrollTop=box.scrollHeight}
async function sendLiveComment(id){const input=$("liveCommentInput"),body=input?.value.trim();if(!body)return;const r=await sb.from('live_comments').insert({live_id:id,user_id:user.id,body});if(r.error)alert(r.error.message);else{input.value='';loadLiveComments(id)}}
async function endNowLive(){if(!liveHost||liveHost.host_id!==user.id)return;await sb.from('live_sessions').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',liveHost.id);Object.values(livePeers).forEach(pc=>pc.close());livePeers={};if(liveChannel)sb.removeChannel(liveChannel);if(liveStream)liveStream.getTracks().forEach(t=>t.stop());liveChannel=null;liveStream=null;liveHost=null;closeLiveModal();show('now')}
function closeLiveModal(){if(liveViewerTimer){clearInterval(liveViewerTimer);liveViewerTimer=null}if(liveViewerChannel){sb.removeChannel(liveViewerChannel);liveViewerChannel=null}if(liveViewerPeer){liveViewerPeer.close();liveViewerPeer=null}$("liveModal").classList.add('hidden');}

document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));$("plus").onclick=()=>user?openPost():guest();
(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=await sync(r.data.session);show("now")}else guest()})();
</script>
